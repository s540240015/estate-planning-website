<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>安心规划 · Plan Ahead CT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --ink:#1f2a37; --muted:#5b6675; --line:#d9d4c7; --paper:#fbf8f2; --card:#ffffff;
  --brand:#1d4e5f; --brand-2:#2f7a72; --accent:#b5672d; --soft:#eef4f2; --warn:#fff4e5; --warn-ink:#8a4b0f;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--paper);color:var(--ink);font-size:18px;line-height:1.7}
a{color:var(--brand)}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
header.top{background:var(--brand);color:#fff}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px}
.logo{font-family:"Noto Serif SC",serif;font-weight:700;font-size:22px;color:#fff;text-decoration:none;letter-spacing:.5px}
.logo small{font-family:"Noto Sans SC";font-weight:400;font-size:14px;opacity:.8;margin-left:8px;letter-spacing:0}
.top nav a{color:#fff;opacity:.9;font-size:15px;text-decoration:none}
.en{color:var(--muted);font-size:.82em;font-weight:400}
h1,h2,h3{font-family:"Noto Serif SC",serif;line-height:1.35;margin:0 0 .4em}
h1{font-size:34px} h2{font-size:26px} h3{font-size:21px}
.hero{padding:48px 0 28px}
.hero p.lead{font-size:20px;color:#34404e;max-width:760px}
.pill-row{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 0}
.pill{background:var(--soft);color:var(--brand);border-radius:999px;padding:6px 14px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px;margin:22px 0 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:6px;transition:transform .12s, box-shadow .12s}
a.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(29,78,95,.12)}
.card .tag{font-size:13px;color:var(--brand-2);font-weight:500}
.card h3{margin:0}
.card p{margin:0;color:#3e4a58;font-size:16px}
.card .go{margin-top:auto;padding-top:8px;color:var(--accent);font-weight:500;font-size:16px}
section.block{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px;margin:0 0 22px}
.callout{background:var(--warn);color:var(--warn-ink);border-radius:10px;padding:14px 18px;margin:14px 0;font-size:16px}
.callout.ok{background:var(--soft);color:var(--brand)}
.steps-list{counter-reset:s;list-style:none;padding:0;margin:10px 0}
.steps-list li{counter-increment:s;position:relative;padding:4px 0 10px 46px}
.steps-list li::before{content:counter(s);position:absolute;left:0;top:4px;width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:13px 22px;font:inherit;font-size:18px;font-weight:500;cursor:pointer;background:var(--brand);color:#fff;text-decoration:none}
.btn:hover{background:#163e4c}
.btn.secondary{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
.btn.accent{background:var(--accent)} .btn.accent:hover{background:#9a5523}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px;align-items:center}
.crumb{margin:22px 0 6px;font-size:15px}
.crumb a{text-decoration:none}
.progress{display:flex;gap:6px;margin:8px 0 20px}
.progress span{flex:1;height:7px;border-radius:4px;background:#e3ded2}
.progress span.on{background:var(--brand-2)}
.stepmeta{color:var(--muted);font-size:15px}
.field{margin:0 0 24px}
.field > label, .field .lbl{display:block;font-weight:700;font-size:18px;margin-bottom:4px}
.field .help{color:var(--muted);font-size:15px;margin:0 0 8px}
input[type=text],input[type=date],textarea,select{width:100%;font:inherit;font-size:18px;padding:12px 14px;border:1.5px solid #c9c3b4;border-radius:10px;background:#fff;color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:3px solid rgba(47,122,114,.3);border-color:var(--brand-2)}
textarea{min-height:110px;resize:vertical}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid #ddd6c6;border-radius:10px;margin:0 0 8px;background:#fff;cursor:pointer}
.opt:hover{border-color:var(--brand-2)}
.field > label.opt{display:flex;font-weight:400;margin-bottom:8px}
.opt input{width:22px;height:22px;margin-top:4px;flex:none;accent-color:var(--brand)}
.opt.sel{border-color:var(--brand-2);background:var(--soft)}
.addr-grid{display:grid;grid-template-columns:2fr 1.2fr .6fr .8fr;gap:10px}
.addr-grid label,.tr-l{display:block;font-size:14px;font-weight:500;color:var(--muted);margin-bottom:2px}
@media (max-width:700px){.addr-grid{grid-template-columns:1fr 1fr}.addr-grid .wide{grid-column:1/-1}}
.tr-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start}
.tr-mid{padding-top:34px;text-align:center;max-width:170px}
.tr-btn{font-size:16px;padding:10px 14px}
.tr-status{font-size:14px;color:var(--muted);margin-top:6px;text-align:left}
.tr-warn{margin-top:8px;color:var(--warn-ink)}
@media (max-width:760px){.tr-grid{grid-template-columns:1fr}.tr-mid{padding-top:0;max-width:none;text-align:left}}
.official{font-family:'Noto Serif',serif;font-size:14px;color:var(--brand-2);margin:-2px 0 4px;font-style:normal}
.official-h{font-family:'Noto Serif',serif;font-style:normal;color:var(--brand-2);margin:-6px 0 6px;font-size:17px}
.official-s{display:block;font-family:'Noto Serif',serif;font-style:normal;font-weight:400;font-size:15px;color:var(--brand-2);margin-top:2px}
.saveall{border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
.infobox{background:var(--soft);border-radius:12px;padding:16px 20px;font-size:16.5px}
.infobox p{margin:0 0 8px}.infobox ul{margin:0 0 8px;padding-left:22px}
.mx-g{margin:18px 0 10px;padding:12px 16px;border-left:5px solid var(--brand);background:#f6f3ec;border-radius:0 10px 10px 0}
.mx-gh{font-weight:700;font-size:19px;color:var(--brand)}
.mx-gd{color:var(--muted);font-size:15px}
.mx-gs{margin-top:8px;font-size:15px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mx-q{background:#fff;border:1.5px solid var(--brand);color:var(--brand);border-radius:8px;padding:3px 12px;font:inherit;font-size:15px;cursor:pointer}
.mx-q:hover{background:var(--soft)}
.mx{border:1.5px solid #ddd6c6;border-radius:12px;padding:14px 16px;margin:0 0 10px;background:#fff}
.mx.done{border-color:var(--brand-2)}
.mx-h{font-weight:700}
.mx-d{color:var(--muted);font-size:15px;margin:2px 0 10px}
.mx-c{display:flex;flex-wrap:wrap;gap:8px}
.mx-o{display:inline-flex;align-items:center;gap:6px;border:1.5px solid #c9c3b4;border-radius:999px;padding:6px 16px;cursor:pointer;font-size:16px;background:#fff}
.mx-o input{position:absolute;opacity:0;width:0;height:0}
.mx-o:focus-within{outline:3px solid rgba(47,122,114,.35)}
.mx-o.sel.mx-no{background:#fdecea;border-color:#b42318;color:#8f1d14;font-weight:700}
.mx-o.sel.mx-yes{background:#e6f4ef;border-color:#2f7a72;color:#1d4e5f;font-weight:700}
.mx-o.sel.mx-trial{background:#fff4e5;border-color:#b5672d;color:#8a4b0f;font-weight:700}
.rows .row{border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 12px;background:#fdfcf9;position:relative}
.rows .row .rowgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.rows .row label{font-size:14px;font-weight:500;color:var(--muted)}
.rows .row input,.rows .row select{font-size:16px;padding:9px 10px}
.rows .rm{position:absolute;top:8px;right:10px;background:none;border:0;color:#a33;cursor:pointer;font-size:14px}
.err{color:#b42318;font-size:15px;margin-top:4px}
.preview-wrap{background:#e9e5dc;border-radius:12px;padding:18px;overflow:auto;max-height:720px}
.preview-wrap .page{transform-origin:top left}
.pv-holder{margin:0 auto 14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2a37;color:#fff;padding:12px 20px;border-radius:10px;font-size:16px;z-index:50;max-width:90vw}
footer{color:var(--muted);font-size:14px;padding:30px 0 50px;border-top:1px solid var(--line);margin-top:30px}
.check-grid label{display:flex;gap:10px;align-items:flex-start;margin:0 0 8px;cursor:pointer}
.check-grid input{width:20px;height:20px;margin-top:5px;accent-color:var(--brand)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 16px;font-size:16px}
.kv b{color:var(--muted);font-weight:500}
.hidden{display:none!important}
.small{font-size:15px}
@media (max-width:640px){h1{font-size:28px} body{font-size:17px} .kv{grid-template-columns:1fr}}

/* ================= Visual refresh: celadon & seal ================= */
:root{
  --ink:#1c2b2a; --muted:#56656a; --line:#d3ddd9; --paper:#f2f5f3; --card:#ffffff;
  --brand:#24564c; --brand-2:#3e7e6f; --soft:#e3eeea; --celadon:#a9c9bc; --seal:#b0342a;
  --accent:#b0342a; --warn:#fbf1e2; --warn-ink:#7a4a12; --radius:12px;
}
body{background:var(--paper);color:var(--ink);line-height:1.75}
::selection{background:var(--celadon)}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--brand-2);outline-offset:2px}
h1,h2,h3{color:var(--ink);letter-spacing:.01em}
h2{font-size:27px} h3{font-size:21px}

header.top{background:#fff;color:var(--ink);border-bottom:1px solid var(--line)}
header.top .wrap{padding:12px 20px}
.logo{color:var(--ink);display:inline-flex;align-items:center;gap:12px;font-size:23px}
.logo .seal{width:38px;height:38px;border-radius:7px;background:var(--seal);color:#fff;display:grid;place-items:center;font-family:"Noto Serif SC",serif;font-size:21px;font-weight:700;transform:rotate(-4deg);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.logo small{color:var(--muted);opacity:1;font-size:14px;margin-left:0}
.top nav a{color:var(--brand);opacity:1;font-weight:500}
.fsgrp{background:var(--soft)}
.fsgrp button{color:var(--brand)}
.fsgrp button[aria-pressed=true]{background:var(--brand);color:#fff}
.langbtn{background:var(--brand);color:#fff;border:0}
.langbtn:hover{background:#1a433b}

.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center;padding:52px 0 40px}
.hero h1{font-size:46px;line-height:1.22;margin-bottom:18px;font-weight:700}
html[lang=en] .hero h1{font-size:44px}
.hero p.lead{font-size:20px;color:#33433f;max-width:34em}
.assure{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:10px}
.assure li{display:flex;gap:12px;align-items:flex-start;font-size:17px}
.assure svg{flex:none;margin-top:4px}
.hero-art svg{width:100%;height:auto;display:block}
@media (max-width:820px){.hero{grid-template-columns:1fr;padding-top:32px}.hero-art{max-width:420px}.hero h1{font-size:36px}}

section.block{border:1px solid var(--line);border-radius:var(--radius);padding:28px 30px;box-shadow:none}
#profile{border-left:6px solid var(--celadon)}

.docs-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:8px}
.docs-head p{margin:0;color:var(--muted);font-size:16px}
.grid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:30px 20px;margin:34px 0 44px}
.card{position:relative;border:1px solid var(--line);border-top:4px solid var(--celadon);border-radius:4px 12px 12px 12px;padding:24px 22px 20px;gap:8px;transition:border-color .15s, transform .15s}
a.card:hover{transform:none;box-shadow:none;border-color:var(--brand-2);border-top-color:var(--brand)}
.card .ftab{position:absolute;top:-30px;left:-1px;height:27px;min-width:58px;padding:0 14px;background:var(--celadon);color:var(--brand);border-radius:8px 8px 0 0;font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px}
a.card:hover .ftab{background:var(--brand);color:#fff}
.card .ico{width:44px;height:44px;border-radius:10px;background:var(--soft);color:var(--brand);display:grid;place-items:center;margin-bottom:4px}
.card .tag{color:var(--muted);font-weight:400;font-size:14px}
.card .go{color:var(--brand);font-weight:700}
a.card:hover .go{text-decoration:underline}

.steps-list li::before{background:var(--brand)}
.btn{border-radius:8px;background:var(--brand)}
.btn:hover{background:#1a433b}
.btn.secondary{border-color:var(--brand-2);color:var(--brand)}
.btn.secondary:hover{background:var(--soft)}
.btn.accent{background:var(--seal)} .btn.accent:hover{background:#912a22}
.progress span{background:#d9e3df;height:8px}
.progress span.on{background:var(--brand-2)}
.opt{border-color:#cfdad5;border-radius:10px}
.opt.sel{background:var(--soft);border-color:var(--brand-2);box-shadow:inset 4px 0 0 var(--brand-2)}
input[type=text],input[type=date],textarea,select{border-color:#bfccc7;border-radius:8px}
.infobox{background:var(--soft)}
.mx-g{background:#eaf1ee;border-left-color:var(--brand)}
.mx{border-color:#cfdad5}
.rows .row{background:#f8faf9}
.preview-wrap{background:#dfe7e3}
.callout{border-left:5px solid #d9a35b}
.pill-row{display:none}
footer{border-top:1px solid var(--line)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
header.top .fsgrp{background:var(--soft);padding:3px}
header.top .fsgrp button{color:var(--brand)}
header.top .fsgrp button[aria-pressed=true]{background:var(--brand);color:#fff}
header.top .langbtn{background:var(--brand);color:#fff}
header.top .langbtn:hover{background:#1a433b}
/* Softer contrast: no pure white, calmer greens */
:root{--paper:#e9eeeb; --card:#f7f9f8; --soft:#dfe8e4; --celadon:#b7cec5; --brand:#2c5a51; --brand-2:#4a8273; --line:#cdd8d3}
body{background:var(--paper)}
header.top{background:var(--paper);border-bottom:1px solid var(--line)}
section.block, .card, .opt, .mx, input[type=text], input[type=date], textarea, select, .btn.secondary{background:var(--card)}
.rows .row{background:#f1f5f3}
.opt.sel{background:#e4ece8}
.infobox{background:#e2eae6}
.mx-g{background:#e4ebe7}
.preview-wrap{background:#d9e1dd}
/* Header: deep muted green band, clearly separate from the page */
header.top{background:#2f4f48;border-bottom:0;box-shadow:0 2px 0 #24403a}
.logo{color:#f1f4f2}
.logo small{color:#b7cbc3}
.logo .seal{box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
header.top .top nav a, .top nav a{color:#dbe7e2}
header.top .fsgrp{background:rgba(255,255,255,.12)}
header.top .fsgrp button{color:#dbe7e2}
header.top .fsgrp button[aria-pressed=true]{background:#e9eeeb;color:#2f4f48;box-shadow:none}
header.top .langbtn{background:transparent;color:#f1f4f2;border:1.5px solid #9fb9b0}
header.top .langbtn:hover{background:rgba(255,255,255,.12)}
.logo{white-space:nowrap}
@media (max-width:640px){
  header.top .wrap{padding:10px 14px;gap:8px}
  .logo{font-size:19px;gap:8px} .logo .seal{width:32px;height:32px;font-size:18px} .logo small{display:none!important}
  header.top .fsgrp button{padding:2px 8px} header.top .langbtn{padding:6px 12px}
  .top nav{gap:8px}
}

/* ---------- Printable document pages (US Letter @96dpi) ---------- */
.page{width:816px;height:1056px;background:#fff;color:#111;position:relative;box-shadow:0 2px 10px rgba(0,0,0,.15);font-family:"Noto Serif","Noto Serif SC","Songti SC",serif;font-size:13.3px;line-height:1.5}
.page .inner{position:absolute;left:84px;right:84px;top:78px;bottom:96px;overflow:hidden}
.page .pfoot{position:absolute;left:84px;right:84px;bottom:40px;font-size:10.5px;color:#555;display:flex;justify-content:space-between;border-top:1px solid #bbb;padding-top:6px;font-family:"Noto Sans SC",sans-serif}
.page p{margin:0 0 9px;text-align:left}
.page .ttl{text-align:center;font-weight:700;font-size:14.5px;line-height:1.45;margin:0 0 16px}
.page h4{font-size:14px;margin:14px 0 6px;font-weight:700}
.page h4.part{font-size:13.3px;letter-spacing:.3px;border-bottom:1.2px solid #222;padding-bottom:3px;margin:18px 0 8px}
.page .fill{font-weight:700;text-decoration:underline;text-underline-offset:2px}
.page .blank{display:inline-block;border-bottom:1px solid #222;min-width:120px;height:1em;vertical-align:baseline}
.page .ck{display:inline-block;width:12px;height:12px;border:1.2px solid #222;margin-right:6px;vertical-align:-1px;text-align:center;font-size:11px;line-height:11px;font-family:Arial,sans-serif}
.page table{width:100%;border-collapse:collapse;font-size:11.5px;margin:4px 0 10px}
.page th,.page td{border:1px solid #888;padding:4px 6px;vertical-align:top;text-align:left}
.page th{background:#f0eee8}
.page .sig{display:grid;grid-template-columns:1fr 1fr;gap:18px 34px;margin:10px 0}
.page .sigline{border-bottom:1px solid #222;height:30px}
.page .siglbl{font-size:11px;color:#333}
.page .indent{padding-left:22px}
.page .note{font-size:11.5px;color:#333;font-style:normal}
.page.tr-page .note{font-size:12px;color:#222}
.page .boxed{border:1.2px solid #222;padding:10px 12px;margin:8px 0 12px}
.page .flag{color:#9a3412;font-weight:700}
.page ul{margin:0 0 9px;padding-left:20px}
.page li{margin:0 0 3px}
.page .instr{font-family:"Noto Sans SC",sans-serif;font-size:12.5px}
.page .instr h4{font-size:15px}
.page.tr-page .inner{top:96px}
.page .pbanner{position:absolute;left:84px;right:84px;top:36px;border:1.5px solid #b42318;color:#b42318;font-family:'Noto Sans SC',sans-serif;font-size:11.5px;font-weight:700;text-align:center;padding:4px 6px;border-radius:4px;background:#fff7f6}
.page .pbanner .pb-en{display:block;font-weight:400;font-size:9.5px}
.page.tr-page{font-family:"Noto Serif SC","Songti SC","Noto Serif",serif;line-height:1.62}
.pv-tabs{display:flex;gap:8px;margin:0 0 10px}
.pv-tabs button{font:inherit;font-size:16px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--brand);background:#fff;color:var(--brand);cursor:pointer}
.pv-tabs button.on{background:var(--brand);color:#fff}
#render-root{position:fixed;left:-20000px;top:0}
.top nav{display:flex;align-items:center;gap:16px}
.langbtn{background:#fff;color:var(--brand);border:0;border-radius:999px;padding:6px 16px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap}
.langbtn:hover{background:var(--soft)}
.fsgrp{display:inline-flex;background:rgba(255,255,255,.15);border-radius:999px;padding:3px;gap:2px}
.fsgrp button{background:none;border:0;color:#fff;font:inherit;font-weight:700;cursor:pointer;border-radius:999px;padding:2px 11px;line-height:1.6}
.fsgrp button[aria-pressed=true]{background:#fff;color:var(--brand)}
.fsgrp button:nth-child(1){font-size:14px}.fsgrp button:nth-child(2){font-size:17px}.fsgrp button:nth-child(3){font-size:20px}
body.fs-1 #app, body.fs-1 #footwrap{zoom:1.15;max-width:835px}
body.fs-2 #app, body.fs-2 #footwrap{zoom:1.32;max-width:727px}
@media (max-width:640px){#navall{display:none} .logo small{display:none}}
html[lang=en] h1, html[lang=en] h2, html[lang=en] h3, html[lang=en] .logo{font-family:"Noto Serif","Noto Serif SC",serif}
</style>
</head>
<body>

<script>
/* =========================================================
   Language
   ========================================================= */
let LANG = null;
try { LANG = localStorage.getItem('planahead-lang'); } catch(e){}
if(LANG!=='zh' && LANG!=='en') LANG = (navigator.language||'').toLowerCase().startsWith('zh') ? 'zh' : 'en';
const T = (zh, en) => LANG==='en' ? en : zh;
const t = o => o==null ? '' : (typeof o==='string' ? o : (LANG==='en' ? (o.en ?? o.zh) : (o.zh ?? o.en)));
/* bilingual label inside generated PDFs: English always, Chinese added in Chinese mode */
const PB = (en, zh) => LANG==='en' ? en : `${en} ${zh}`;

/* =========================================================
   Helpers
   ========================================================= */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const filled = v => v !== undefined && v !== null && String(v).trim() !== '';
const F = (v, w=160) => filled(v) ? `<span class="fill">${esc(v)}</span>` : `<span class="blank" style="min-width:${w}px"></span>`;
const paras = txt => String(txt||'').split(/\n+/).map(s=>s.trim()).filter(Boolean).map(s=>`<p>${esc(s)}</p>`);
const strip = s => String(s).replace(/<[^>]+>/g,'');
function toast(msg){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const el=document.createElement('div'); el.className='toast'; el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(), 3800); }

const STORE_KEY = 'planahead-ct-v1';
let ANSWERS = {};
try { ANSWERS = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch(e) { ANSWERS = {}; }
{ const ad = ANSWERS['advance-directive']; if(ad){ if(typeof ad.giftParts==='string'){ ad.giftOther = ad.giftParts; ad.giftParts = []; } if(typeof ad.giftLimited==='string'){ ad.giftLimited = []; } } }
{ const h = ANSWERS['hipaa']; if(h && typeof h.srcList==='string' && !h.srcRows){ h.srcRows = h.srcList.split(/\n+/).map(x=>x.trim()).filter(Boolean).map(n=>({n})); } }
const _poa = ANSWERS['power-of-attorney']; if(_poa && typeof _poa.special==='string' && !_poa.specialOpts){ /* keep old free text */ }
if(ANSWERS['advance-directive'] && ANSWERS['advance-directive'].lw==='partial'){ ANSWERS['advance-directive'].lw='custom'; delete ANSWERS['advance-directive'].lwWant; }
const PROFILE_FIELDS = [
  {k:'name', t:'text', nm:true, label:{zh:'英文全名', en:'Full legal name'}},
  {k:'addr', t:'address', label:{zh:'地址', en:'Address'}},
  {k:'dob', t:'date', label:{zh:'出生日期', en:'Date of birth'}}
];
const hasVal = v => v && typeof v==='object' ? (filled(v.st)||filled(v.city)||filled(v.zip)) : filled(v);
const profile = () => (ANSWERS._profile = ANSWERS._profile || {});
/* Shared fields read from the profile; personal letters only prefill when empty */
function syncShared(d){
  const a = ANSWERS[d.id] = ANSWERS[d.id] || {}, P = profile();
  d.steps.forEach(st=>st.fields.forEach(f=>{
    if(f.shared){ if(hasVal(P[f.shared])) a[f.k] = P[f.shared]; else if(hasVal(a[f.k])) P[f.shared] = a[f.k]; }
    else if(f.prefill && !filled(a[f.k]) && filled(P[f.prefill])) a[f.k] = P[f.prefill];
  }));
  if(d.id==='advance-directive'){ if(a.consSame==='same') a.consName = a.rep||''; if(a.consAltSame==='same') a.consAlt = a.alt||''; if(a.consAltSame==='none') a.consAlt = ''; }
  if(d.id==='power-of-attorney'){ if(a.cons1Same==='same') a.cons1 = a.agent1||''; if(a.cons2Same==='same') a.cons2 = a.succ1||''; if(a.cons2Same==='none') a.cons2 = ''; }
  return a;
}
function pushShared(d, k, v){
  const f = d && d.steps.flatMap(st=>st.fields).find(x=>x.k===k && x.shared);
  if(f){ profile()[f.shared] = v; }
}
function persist(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(ANSWERS)); } catch(e){} }

const sigCell = (label) => `<div><div class="sigline"></div><div class="siglbl">${label}</div></div>`;
const witnessPair = (zh=false) => { const w = zh ? ['见证人签名','印刷体姓名','门牌号码和街道','城市、州和邮编'] : ['Witness signature','Printed name','Number and Street','City, State and Zip Code']; return `<div class="sig">${w.map(x=>sigCell(x)+sigCell(x)).join('')}</div>`; };

/* Signing-instruction page: Chinese mode = Chinese + English; English mode = English only */
function instructionBlocks(title, items){
  const out = [`<div class="instr"><div class="ttl" style="font-family:'Noto Sans SC'">${PB('How to Sign and Make This Document Effective','· 签署与生效说明')}<br><span style="font-weight:400;font-size:12.5px">${esc(title)}</span></div></div>`];
  items.forEach(([zh,en],i)=> out.push(LANG==='en'
    ? `<div class="instr"><p><b>${i+1}.</b> ${en}</p></div>`
    : `<div class="instr"><p><b>${i+1}. ${zh}</b><br><span style="color:#444">${en}</span></p></div>`));
  out.push(`<div class="instr"><p class="note">${T('本页为说明页，签署前可移除，不属于文件正文。','')} This page is guidance only and is not part of the signed document. This document was prepared with a free self-help tool and is not legal advice.</p></div>`);
  return out;
}

/* =========================================================
   DOCUMENT DEFINITIONS
   Each text item is {zh, en}.
   ========================================================= */

/* Life-sustaining treatments for the item-by-item choice in the Advance Directive */
const LS_GROUPS = [
  {v:'inv', zh:'有创或对身体负担大的治疗', en:'Invasive or physically burdensome treatments',
   d:{zh:'会在身体上留下伤口、需要插管或手术，或者本身会带来明显的痛苦。', en:'These involve tubes, incisions or surgery, or cause significant pain or distress in themselves.'}},
  {v:'non', zh:'无创或负担较轻的治疗', en:'Non-invasive or less burdensome treatments',
   d:{zh:'不需要插管或手术，一般经面罩、口服或手臂上的点滴给予。负担较轻，但不代表完全没有不适。', en:'No breathing tube or surgery; usually given by mask, by mouth or through an IV in the arm. Less burdensome, though not always free of discomfort.'}}
];
const LS_ITEMS = [
  {v:'vent', g:'inv', zh:'有创呼吸机（插管或气管切开）', en:'Breathing machine through a tube (intubation or tracheostomy)',
   d:{zh:'从口或鼻插管到气管，或在颈部做气管切开，接呼吸机替您呼吸。通常需要镇静，插管期间不能说话、不能进食。', en:'A tube is placed through the mouth or nose into the windpipe, or through a tracheostomy in the neck, connected to a ventilator. Usually requires sedation; you cannot speak or eat while intubated.'},

  {v:'cpr', g:'inv', zh:'心肺复苏（CPR）', en:'CPR (cardiopulmonary resuscitation)',
   d:{zh:'心跳或呼吸停止时，进行用力的胸外按压、电击、注射急救药物，通常还会紧急插管。对末期或年老体弱的病人，成功率很低，常造成肋骨骨折。', en:'Forceful chest compressions, electric shocks and emergency drugs when the heart or breathing stops, usually with emergency intubation. For terminally ill or frail patients, success is rare and rib fractures are common.'},
   pdf:'cardiopulmonary resuscitation (CPR)'},
  {v:'ecmo', g:'inv', zh:'体外膜肺（ECMO）等心肺机器支持', en:'ECMO and other mechanical heart or lung support',
   d:{zh:'在颈部或大腿的大血管插入粗管，把血液引出体外，用机器加氧后再送回体内，替代心肺功能。必须在加护病房深度镇静，可能出现大出血、中风、感染。', en:'Large tubes are placed in major blood vessels in the neck or groin; a machine oxygenates the blood outside the body and returns it, replacing heart and lung function. Requires deep sedation in intensive care; risks include major bleeding, stroke and infection.'},
   pdf:'extracorporeal membrane oxygenation (ECMO) or other mechanical heart or lung support'},
  {v:'tube', g:'inv', zh:'人工营养（插管喂食）', en:'Artificial nutrition (tube feeding)',
   d:{zh:'经鼻胃管灌入营养液，或做小手术在腹部放置胃造口管（G-tube）。鼻胃管常令人不适，病人可能需要被约束以免拔管。', en:'Liquid nutrition through a tube in the nose, or a feeding tube placed in the abdomen by a minor procedure (G-tube). Nasal tubes are often uncomfortable, and patients may be restrained to keep them from pulling them out.'},
   pdf:'artificial nutrition through a feeding tube'},
  {v:'dialysis', g:'inv', zh:'洗肾（透析）', en:'Dialysis',
   d:{zh:'肾衰竭时，用机器替代肾脏过滤血液。需要在大血管放置导管或做血管瘘管，通常每周数次，每次几小时。', en:'When the kidneys fail, a machine filters the blood. Requires a catheter in a large vein or a surgically created access, usually several times a week for a few hours each.'},
   pdf:'dialysis'},
  {v:'pressors', g:'inv', zh:'升压药', en:'Blood pressure medicines (vasopressors)',
   d:{zh:'在加护病房经静脉给予强效药物，勉强维持血压。通常需要在颈部或胸部放置中心静脉导管。', en:'Powerful IV medicines, usually given in intensive care, to keep blood pressure up. Usually requires a central line in the neck or chest.'},
   pdf:'medicines to maintain my blood pressure (vasopressors)'},
  {v:'niv', g:'non', zh:'无创呼吸机（面罩，BiPAP / CPAP）', en:'Breathing support by mask (BiPAP / CPAP)',
   d:{zh:'戴紧贴口鼻的面罩，由机器加压辅助呼吸，不插管，可以随时拿掉。面罩较紧，有些人会觉得不舒服或口干。', en:'A tight-fitting mask over the nose and mouth pushes air to help you breathe. No tube, and it can be removed at any time, though some people find the mask uncomfortable or drying.'},
   pdf:'non-invasive ventilation by mask (such as BiPAP or CPAP)'},
  {v:'iv', g:'non', zh:'人工水分（静脉输液）', en:'Artificial hydration (IV fluids)',
   d:{zh:'经手臂静脉打点滴补充水分。', en:'Fluids given through an IV in the arm.'},
   pdf:'artificial hydration through intravenous (IV) fluids'},
  {v:'transfusion', g:'non', zh:'输血', en:'Blood transfusions',
   d:{zh:'经静脉输入红血球、血小板或血浆等血液制品。', en:'Red blood cells, platelets or plasma given through a vein.'},
   pdf:'blood transfusions'},
  {v:'antibiotics', g:'non', zh:'用来延长生命的抗生素', en:'Antibiotics to prolong life',
   d:{zh:'口服或静脉给予，治疗感染（例如肺炎）以延长生命。若只是为了减轻不适，不在此列。', en:'Given by mouth or IV to treat infections such as pneumonia in order to prolong life. Antibiotics given only for comfort are not included.'},
   pdf:'antibiotics given to prolong my life (rather than solely for comfort)'}
];


/* Option lists that turn free text into standard English wording */
const OTHER_REQ = [
  {v:'home', zh:'如果可能，我希望在家中度过最后的日子', en:'If possible, I wish to spend my final days at home', pdf:'If possible, I wish to spend my final days at home.'},

  {v:'pain', zh:'请充分控制我的疼痛和不适，即使所需药物可能缩短我的生命', en:'Fully treat my pain and discomfort, even if the medication needed may shorten my life', pdf:'I want my pain and discomfort fully treated, even if the medication needed to do so may shorten my life.'},

];
const ORGANS = [
  {v:'kidneys', zh:'肾脏', en:'Kidneys'},{v:'liver', zh:'肝脏', en:'Liver'},{v:'heart', zh:'心脏', en:'Heart'},{v:'lungs', zh:'肺', en:'Lungs'},
  {v:'pancreas', zh:'胰脏', en:'Pancreas'},{v:'intestines', zh:'肠', en:'Intestines'},{v:'corneas', zh:'眼角膜', en:'Corneas'},
  {v:'skin', zh:'皮肤', en:'Skin'},{v:'heart valves', zh:'心脏瓣膜', en:'Heart valves'},{v:'bone and connective tissue', zh:'骨骼及结缔组织', en:'Bone and connective tissue'}
];
const GIFT_PURPOSES = [
  {v:'transplantation', zh:'器官移植', en:'Transplantation'},{v:'therapy', zh:'医疗治疗', en:'Therapy'},
  {v:'research', zh:'医学研究', en:'Research'},{v:'education', zh:'医学教育', en:'Education'}
];
const POA_SPECIAL = [
  {v:'gifts', zh:'允许代理人用我的财产赠与我的配偶、子女和孙辈，每人每年不超过联邦赠与税的年度免税额', en:'Allow my agent to make gifts to my spouse, children and grandchildren, up to the federal gift tax annual exclusion per person per year',

   pdf:'This power of attorney shall become effective only upon my incapacity, as determined in a written statement signed by two licensed physicians. Until that time, my agent shall have no authority to act on my behalf.'},
  {v:'records', zh:'代理人必须保存所有收支记录，我的配偶或子女要求时须提供账目', en:'My agent must keep records of all transactions and give an accounting if my spouse or children ask',
   pdf:'My agent shall keep records of all receipts, disbursements and transactions made on my behalf and shall provide an accounting upon the request of my spouse or any of my children.'},
  {v:'nocomp', zh:'代理人不收报酬，但可以报销合理开支', en:'My agent serves without pay but may be reimbursed for reasonable expenses',
   pdf:'My agent shall serve without compensation but shall be entitled to reimbursement of reasonable expenses incurred on my behalf.'},
  {v:'comp', zh:'代理人可以收取合理报酬，并报销合理开支', en:'My agent may receive reasonable pay and be reimbursed for reasonable expenses',
   pdf:'My agent shall be entitled to reasonable compensation and to reimbursement of reasonable expenses incurred on my behalf.'}
];
const PROVIDER_TYPES = [['Hospital','医院'],['Physician','医生'],['Clinic','诊所'],['Pharmacy','药房'],['Laboratory','化验室'],['Health plan / insurer','保险公司'],['Nursing or care facility','护理机构'],['Home health agency','居家护理机构'],['Other','其他']].map(([en,zh])=>({v:en,zh,en}));
const usDate = v => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v||''); return m ? `${m[2]}/${m[3]}/${m[1]}` : (v||''); };
const pickLabels = (list, vals, key='en') => list.filter(o=>(vals||[]).includes(o.v)).map(o=>o[key]);
const A = v => !v ? '' : (typeof v==='string' ? v : [v.st, v.city, [v.state, v.zip].filter(filled).join(' ')].filter(filled).join(', '));

const DOCS = [];

/* ---------- 1. ADVANCE DIRECTIVE (CGS 19a-575a) ---------- */
DOCS.push({
  id:'advance-directive',
  name:{zh:'医疗预嘱', en:'Advance Directive'},
  official:'Health Care Instructions and Appointment of Health Care Representative',
  tag:{zh:'生前预嘱 + 医疗委托 + 器官捐赠', en:'Living will + health care representative + organ donation'},
  card:{zh:'一份文件包含：临终医疗意愿（生前预嘱）、指定医疗代表（医疗委托书）、预先指定监护人，以及器官捐赠意愿。',
        en:'One document covering your end-of-life treatment wishes (living will), the person who makes medical decisions for you (health care representative), a future conservator, and organ donation.'},
  statute:'Conn. Gen. Stat. § 19a-575a',
  intro:{
    purpose:{zh:'万一您因重病或意外<b>无法自己表达</b>医疗决定，这份文件告诉医生两件事：您对维生治疗（呼吸机、心肺复苏、插管喂食）的意愿，以及由<b>谁</b>代您做医疗决定。它还可以预先指定法院需要时的人身监护人（conservator of the person），并记录您的器官捐赠意愿。',
             en:'If illness or injury ever leaves you <b>unable to speak for yourself</b>, this document tells your doctors two things: your wishes about life support (ventilators, CPR, tube feeding), and <b>who</b> makes health care decisions for you. It can also name the person you would want as conservator of the person if a court ever needs to appoint one, and record your wishes about organ donation.'},
    who:{zh:'所有 18 岁以上的成年人。很多家庭直到急诊室里才发现，没人有权替病人做决定。',
         en:'Every adult 18 or older. Many families only discover in the emergency room that nobody has the authority to decide for their loved one.'},
    effective:[
      {zh:'用英文打印出来（只填空，不改法定条文）。', en:'Print it in English. The statutory wording is not changed; only the blanks are filled in.'},
      {zh:'在<b>两名成年见证人</b>面前签名并写上日期。见证人也签名并填写地址。', en:'Sign and date it in front of <b>two adult witnesses</b>, who then sign and add their addresses.'},
      {zh:'<b>您指定的医疗代表不能当见证人。</b>', en:'<b>The person you appoint as health care representative may not be a witness.</b>'},
      {zh:'公证不是必须的。如果想多一层保障，两位见证人可以在公证人面前签最后一页的"宣誓书"（Affidavit）。可以事后补签，但建议当天一起完成。', en:'Notarization is not required. For extra assurance, both witnesses may sign the optional affidavit on the last page before a notary. It can be done later, but doing it the same day is best.'},
      {zh:'这份文件会<b>撤销您以前签过的医疗预嘱和医疗代表指定</b>。签好后，请收回或销毁旧文件的副本，并通知医生。', en:'This document <b>revokes any advance directive or health care representative appointment you signed before</b>. Collect or destroy copies of the old one and tell your doctors.'},
      {zh:'把副本交给医疗代表、家庭医生和常去的医院，原件放在家人找得到的地方。', en:'Give copies to your representative, your doctor and your hospital, and keep the original where your family can find it.'}
    ],
    need:[{zh:'医疗代表和后备代表的英文全名', en:'Full legal names of your representative and an alternate'},{zh:'（可选）监护人人选', en:'(Optional) your choice of conservator'},{zh:'约 10 分钟', en:'About 10 minutes'}]
  },
  steps:[
    {title:{zh:'关于您', en:'About you'}, fields:[
      {k:'name', t:'text', nm:true, shared:'name', label:{zh:'您的英文全名', en:'Your full legal name'}, req:true},
    ]},
    {title:{zh:'维生治疗意愿', en:'Life support instructions'}, fields:[
      {k:'lwInfo', t:'info', html:{
        zh:`<p><b>什么是"维生治疗"？</b>康州法律（§19a-570）的定义是：<b>只能推迟死亡、或维持永久昏迷状态</b>的任何医疗程序或干预。同一种治疗，用在能康复的病人身上是"救命"，用在末期病人身上就是"维生"。</p>
<p><b>这一部分什么时候才会用到？</b>只有在主治医生认定以下两种情况之一，而且您已经无法自己表达时：</p>
<ul><li><b>末期</b>：无法治愈或不可逆转的疾病，如果不用维生治疗，会在较短时间内死亡；</li><li><b>永久失去意识</b>：永久昏迷或植物人状态，完全不能感知自己和外界，而且不可逆转。</li></ul>
<p>平时生病、开刀、可以治好的急症，<b>都不受影响</b>，医生会照常全力治疗。</p>
<p><b>不论您怎么选，依康州法律，舒适护理和止痛一定会提供</b>（§19a-573）。</p>`,
        en:`<p><b>What is "life support"?</b> Connecticut law (§19a-570) defines a life support system as any medical procedure or intervention that would <b>serve only to postpone the moment of death or maintain a state of permanent unconsciousness</b>. The same treatment can save a patient who can recover, and only prolong dying for one who cannot.</p>
<p><b>When does this section apply?</b> Only when your attending physician determines one of the following, and you can no longer speak for yourself:</p>
<ul><li><b>Terminal condition</b>: an incurable or irreversible condition that, without life support, will cause death within a relatively short time;</li><li><b>Permanently unconscious</b>: a permanent coma or persistent vegetative state with no awareness of yourself or your surroundings, which is irreversible.</li></ul>
<p>Ordinary illness, surgery, and treatable emergencies are <b>not affected</b>; doctors will treat you as usual.</p>
<p><b>Whatever you choose, Connecticut law requires that comfort care and pain relief always be provided</b> (§19a-573).</p>`}},
      {k:'lw', t:'radio', label:{zh:'在上述两种情况下，您希望：', en:'In either of those situations, I want:'}, req:true, opts:[
        {v:'statutory', zh:'<b>不要维生治疗，只要舒适护理。</b>采用康州法定条文：不用人工呼吸、心肺复苏、人工营养与水分等维生系统，让我自然离世，但要给我足够的止痛药物。', en:'<b>No life support — comfort care only.</b> Uses the Connecticut statutory wording: no artificial respiration, CPR, artificial nutrition and hydration or other life support; allow a natural death, with enough pain medication to keep me comfortable.'},
        {v:'custom', zh:'<b>我想逐项决定。</b>下一题会列出常见的维生治疗，每一项您都可以选"不要""要"或"可以短期试用"。', en:'<b>I want to decide treatment by treatment.</b> The next question lists common life-sustaining treatments; for each you can choose "No", "Yes" or "Time-limited trial".'},

        help:{zh:'"可以短期试用"指：先用一段时间（例如几天到两周），如果医生和您的医疗代表认为没有合理的康复希望，就停止。不确定的项目，建议和家庭医生讨论后再决定。', en:'"Time-limited trial" means: try it for a period (for example, a few days to two weeks), and stop if your doctor and representative find no reasonable hope of meaningful recovery. If unsure about any item, talk it over with your doctor.'},

    {title:{zh:'医疗代表', en:'Health care representative'}, fields:[
      {k:'rep', t:'text', nm:true, label:{zh:'医疗代表的英文全名', en:'Health care representative – full name'}, req:true, help:{zh:'当医生判断您无法理解或表达医疗决定时，由此人代您做所有医疗决定。请选择您信任、了解您价值观、能在压力下做决定的人。', en:'This person makes all health care decisions for you if your doctor determines you cannot understand or communicate them. Choose someone you trust, who knows your values, and who can make hard decisions under pressure.'}},

    ]},
    {title:{zh:'监护人（可选）', en:'Conservator (optional)'}, fields:[
      {k:'cons', t:'radio', label:{zh:'是否预先指定"人身监护人"？', en:'Designate a conservator of the person?'}, req:true, help:{zh:'<b>人身监护人</b>管的是您的生活和照顾（例如住在哪里、由谁照顾），由<b>法院</b>指定。<br>• 您签了医疗预嘱，通常就用不到监护人；只有在家人起争议、医疗代表无法担任或被告上法院时，法院才会介入。<br>• 法院原则上会指定您在这里提名的人，除非他不愿意、做不到，或被证明不适合（例如滥用权力）。<br>• 不提名的话，法院可能指定您不认识的人。<br>很多人会填写和医疗代表同一人。', en:'A <b>conservator of the person</b> oversees your care and living arrangements (where you live, who cares for you) and is appointed by a <b>court</b>.<br>• With an advance directive you usually never need one; a court steps in only if there is a family dispute, or your representative cannot serve or is taken to court.<br>• The court will appoint the person you name here unless they are unwilling, unable, or shown to be unfit (for example, for abusing their authority).<br>• If you name no one, the court may appoint someone you do not know.<br>Many people name the same person as their health care representative.'}, opts:[
        {v:'yes', zh:'是', en:'Yes'},{v:'no', zh:'否，不包含这一部分', en:'No, leave this section out'}]},
      {k:'consSame', t:'radio', label:{zh:'监护人是否就是您的医疗代表？', en:'Is the conservator the same person as your health care representative?'}, show:a=>a.cons==='yes', req:true, opts:[{v:'same', zh:'是，同一人（自动填入医疗代表的姓名）', en:'Yes, the same person (filled in automatically)'},{v:'other', zh:'否，另外指定一位', en:'No, someone else'}]},
      {k:'consSameInfo', t:'info', show:a=>a.cons==='yes' && a.consSame==='same', html:a=>({zh:'监护人将填入：<b>'+(filled(a.rep)?esc(a.rep):'（请先在第 4 步填写医疗代表）')+'</b>', en:'Conservator will be: <b>'+(filled(a.rep)?esc(a.rep):'(enter your health care representative in step 4 first)')+'</b>'})},
      {k:'consName', t:'text', nm:true, label:{zh:'监护人英文全名', en:'Conservator – full name'}, show:a=>a.cons==='yes' && a.consSame==='other', req:true},
      {k:'consAltSame', t:'radio', label:{zh:'后备监护人', en:'Successor conservator'}, show:a=>a.cons==='yes', req:true, help:{zh:'建议填写<b>另一位</b>您信任的人。如果第一人无法担任或被法院认定不适合，法院会优先考虑这一位。', en:'We suggest a <b>different</b> person you trust. If your first choice cannot serve or is found unfit, the court will consider this person first.'}, opts:[{v:'same', zh:'与后备医疗代表同一人（自动填入）', en:'Same as my alternative health care representative (filled in automatically)'},{v:'other', zh:'另外指定一位', en:'Someone else'},{v:'none', zh:'不指定', en:'None'}]},
      {k:'consAltInfo', t:'info', show:a=>a.cons==='yes' && a.consAltSame==='same', html:a=>({zh:'后备监护人将填入：<b>'+(filled(a.alt)?esc(a.alt):'（您还没有填写后备医疗代表，请回第 4 步填写）')+'</b>', en:'Successor conservator will be: <b>'+(filled(a.alt)?esc(a.alt):'(you have not entered an alternative representative — see step 4)')+'</b>'})},

    ]},
    {title:{zh:'器官捐赠', en:'Anatomical gift'}, fields:[
      {k:'gift', t:'radio', label:{zh:'您是否愿意在身故后捐赠器官或组织？', en:'Would you like to donate organs or tissue after death?'}, req:true, opts:[
        {v:'any', zh:'愿意，捐赠任何需要的器官或组织', en:'Yes – any needed organs or parts'},
        {v:'some', zh:'只捐赠特定器官或组织', en:'Only specific organs or parts'},

      {k:'giftParts', t:'checks', label:{zh:'捐赠哪些器官或组织？（可多选）', en:'Which organs or parts? (choose any)'}, show:a=>a.gift==='some', req:true, opts:ORGANS},
      {k:'giftOther', t:'trtext', label:{zh:'其他器官或组织（可选）', en:'Other organs or parts (optional)'}, show:a=>a.gift==='some'},

        {v:'limited', zh:'只限以下用途', en:'Only these limited purposes'}]},
      {k:'giftLimited', t:'checks', label:{zh:'只限以下用途（可多选）', en:'Only for these purposes (choose any)'}, show:a=>a.gift && a.gift!=='no' && a.giftPurpose==='limited', req:true, opts:GIFT_PURPOSES}
    ]}
  ],
  build(a, zh=false){
    const X = (en, c) => zh ? c : en;
    const hasCons = a.cons==='yes', hasGift = a.gift && a.gift!=='no';
    let head = X(`THESE ARE MY HEALTH CARE INSTRUCTIONS.<br>MY APPOINTMENT OF A HEALTH CARE REPRESENTATIVE${(hasCons||hasGift)?',':''}`, `这是我的医疗指示。<br>我对医疗代表的指定${(hasCons||hasGift)?'，':''}`);
    if(hasCons) head += X(`<br>THE DESIGNATION OF MY CONSERVATOR OF THE PERSON<br>FOR MY FUTURE INCAPACITY`, `<br>我对未来失能时<br>人身监护人的指定`);
    if(hasGift) head += X(`<br>AND<br>MY DOCUMENT OF ANATOMICAL GIFT`, `<br>以及<br>我的器官捐赠文件`);
    const together = [X('the appointment of my health care representative','我对医疗代表的指定')];
    if(hasCons) together.push(X('the designation of my conservator of the person for future incapacity','我对未来失能时人身监护人的指定'));
    if(hasGift) together.push(X('my document of anatomical gift','我的器官捐赠文件'));
    const joinList = l => l.length===1? l[0] : zh ? l.slice(0,-1).join('、')+'以及'+l[l.length-1] : l.slice(0,-1).join(', ') + ' and ' + l[l.length-1];
    const userText = k => zh && filled(a[k+'_zh']) ? a[k+'_zh'] : a[k];
    const B = [];
    B.push(`<div class="ttl">${head}</div>`);
    B.push(X(`<p>To any physician or advanced practice registered nurse who is treating me: These are my health care instructions${a.lw!=='none'?' including those concerning the withholding or withdrawal of life support systems':''}, together with ${joinList(together)}. As my physician or advanced practice registered nurse, you may rely on these health care instructions and any decision made by my health care representative${hasCons?' or conservator of my person':''}, if I am incapacitated to the point when I can no longer actively take part in decisions for my own life, and am unable to direct my physician or advanced practice registered nurse as to my own medical care.</p>`,
      `<p>致任何为我治疗的医生或高级执业注册护士：这是我的医疗指示${a.lw!=='none'?'（包括关于不予或撤除维生系统的指示）':''}，以及${joinList(together)}。如果我失能到无法再积极参与关于自己生命的决定，也无法就自己的医疗照护向医生或高级执业注册护士作出指示，作为我的医生或高级执业注册护士，您可以依赖这些医疗指示，以及我的医疗代表${hasCons?'或人身监护人':''}所作的任何决定。</p>`));
    B.push(X(`<p>I revoke any prior health care instructions, living will, appointment of health care representative or health care agent, and designation of conservator of the person that I have made.</p>`,
      `<p>我撤销我以前订立的任何医疗指示、生前预嘱、医疗代表或医疗代理人的指定，以及人身监护人的指定。</p>`));
    let partNo = 0; const PART = (en, c) => { const n = ++partNo; return `<h4 class="part">${X(`PART ${n} – ${en}`, `第 ${n} 部分 – ${c}`)}</h4>`; };
    B.push(PART('HEALTH CARE INSTRUCTIONS','医疗指示'));
    const DEF = X(`By terminal condition, I mean that I have an incurable or irreversible medical condition which, without the administration of life support systems, will, in the opinion of my attending physician or advanced practice registered nurse, result in death within a relatively short time. By permanently unconscious I mean that I am in a permanent coma or persistent vegetative state which is an irreversible condition in which I am at no time aware of myself or the environment and show no behavioral response to the environment.`,
      `所谓"末期状况"，是指我患有无法治愈或不可逆转的疾病，依我的主治医生或高级执业注册护士的意见，若不使用维生系统，将在相对短的时间内导致死亡。所谓"永久失去意识"，是指我处于永久昏迷或持续植物人状态，这是一种不可逆转的状况，我在任何时候都无法感知自己或周围环境，对环境也没有任何行为反应。`);
    const COMFORT = X(`I do want sufficient pain medication to maintain my physical comfort. I do not intend any direct taking of my life, but only that my dying not be unreasonably prolonged.`,
      `我确实希望获得足够的止痛药物，以维持身体上的舒适。我无意直接结束自己的生命，只是希望我的死亡过程不被不合理地延长。`);
    const I_AM = X(`I, ${F(a.name,220)}, the author of this document,`, `本人 ${F(a.name,180)}，即本文件的订立人，`);
    if(a.lw==='none'){
      B.push(X(`<p>${I_AM} do not give specific instructions concerning life support systems in this document. My health care representative shall make such decisions in accordance with my wishes as otherwise known to my health care representative or, if my wishes are not known, in my best interests.</p>`,
        `<p>${I_AM}不在本文件中就维生系统作出具体指示。我的医疗代表应依照其所知的我的意愿作出此类决定；如不知道我的意愿，则以我的最大利益为依归。</p>`));
    } else if(a.lw==='full'){
      B.push(X(`<p>${I_AM} request that, if my condition is deemed terminal or if I am determined to be permanently unconscious, all life support systems that are medically appropriate be provided to prolong my life, including, but not limited to, artificial respiration, cardiopulmonary resuscitation and artificial means of providing nutrition and hydration. ${DEF} I do want sufficient pain medication to maintain my physical comfort.</p>`,
        `<p>${I_AM}要求：如果我的状况被认定为末期，或我被确定为永久失去意识，应提供一切医疗上适当的维生系统以延长我的生命，包括但不限于人工呼吸、心肺复苏以及人工提供营养和水分。${DEF}我确实希望获得足够的止痛药物，以维持身体上的舒适。</p>`));
    } else if(a.lw==='custom'){
      const m = a.lwItems||{};
      const pick = c => LS_ITEMS.filter(it=>m[it.v]===c).map(it=> zh ? it.zh : it.pdf);
      const fmt = l => zh ? l.join('；') : (l.length===1? l[0] : l.slice(0,-1).join('; ')+'; and '+l[l.length-1]);
      const no = pick('no'), yes = pick('yes'), trial = pick('trial');
      B.push(X(`<p>${I_AM} give the following instructions in the event my condition is deemed terminal or I am determined to be permanently unconscious. ${DEF}</p>`,
        `<p>${I_AM}就我的状况被认定为末期、或我被确定为永久失去意识的情况，作出以下指示。${DEF}</p>`));
      let li = 0; const L = () => String.fromCharCode(97 + li++);
      if(no.length){ const l = L(); B.push(X(`<p class="indent">(${l}) I do not want the following life support systems, and I request that I be allowed to die and not be kept alive through them: ${fmt(no)}.</p>`,
        `<p class="indent">(${l}) 我不要以下维生系统，并要求让我自然离世，不要通过这些系统维持生命：${fmt(no)}。</p>`)) };
      if(yes.length){ const l = L(); B.push(X(`<p class="indent">(${l}) I do want the following to be provided: ${fmt(yes)}.</p>`,
        `<p class="indent">(${l}) 我确实希望提供以下治疗：${fmt(yes)}。</p>`)) };
      if(trial.length){ const l = L(); B.push(X(`<p class="indent">(${l}) I consent to a time-limited trial of the following, to be withdrawn if my attending physician or advanced practice registered nurse and my health care representative determine that there is no reasonable expectation of meaningful recovery: ${fmt(trial)}.</p>`,
        `<p class="indent">(${l}) 我同意短期试用以下治疗；如果我的主治医生或高级执业注册护士与我的医疗代表认定没有合理的康复希望，应予以撤除：${fmt(trial)}。</p>`)) };
      if((a.lwPrinciple||[]).includes('avoid')) B.push(X(`<p>As a general principle, I wish to avoid invasive treatments that would cause additional injury to my body or add to my suffering. I ask my health care representative and my physicians to apply this principle to any decision not specifically addressed above.</p>`,
        `<p>作为总原则，我希望避免会对身体造成额外创伤或增加痛苦的有创治疗。对于上面没有具体提到的任何决定，我请我的医疗代表和医生按照这一原则处理。</p>`));
      B.push(X(`<p>For any life support system not listed above, my health care representative shall decide in accordance with these instructions and my known wishes. ${COMFORT}</p>`,
        `<p>对于上面没有列出的任何维生系统，我的医疗代表应依照这些指示及我已知的意愿作出决定。${COMFORT}</p>`));
    } else {
      B.push(X(`<p>${I_AM} request that, if my condition is deemed terminal or if I am determined to be permanently unconscious, I be allowed to die and not be kept alive through life support systems. ${DEF} The life support systems which I do not want include, but are not limited to: Artificial respiration, cardiopulmonary resuscitation and artificial means of providing nutrition and hydration. ${COMFORT}</p>`,
        `<p>${I_AM}要求：如果我的状况被认定为末期，或我被确定为永久失去意识，让我自然离世，不要通过维生系统维持生命。${DEF}我不要的维生系统包括但不限于：人工呼吸、心肺复苏以及人工提供营养和水分。${COMFORT}</p>`));
    }
    const ck = v => `<span class="ck">${a.preg===v?'✓':''}</span>`;
    B.push(X(`<p style="margin-bottom:4px"><b>If I am pregnant:</b></p>`, `<p style="margin-bottom:4px"><b>如果我怀孕：</b></p>`));
    B.push(X(`<p class="indent" style="margin-bottom:4px">${ck('1')}(1) I intend to accept life support systems if my doctor believes that doing so would allow my fetus to reach a live birth.</p>`,
      `<p class="indent" style="margin-bottom:4px">${ck('1')}(1) 如果我的医生认为接受维生系统可以让胎儿活着出生，我打算接受维生系统。</p>`));
    B.push(X(`<p class="indent" style="margin-bottom:4px">${ck('2')}(2) I intend this document to apply without modifications.</p>`,
      `<p class="indent" style="margin-bottom:4px">${ck('2')}(2) 我打算让本文件不作修改地适用。</p>`));
    B.push(X(`<p class="indent">${ck('3')}(3) I intend this document to apply as follows: `, `<p class="indent">${ck('3')}(3) 我打算让本文件按以下方式适用：`) + `${a.preg==='3'?F(userText('pregText')):'<span class="blank" style="min-width:200px"></span>'}</p>`);
    { const reqs = pickLabels(OTHER_REQ, a.otherReq, zh ? 'zh' : 'pdf').map(r => zh ? r+'。' : r);
      if(reqs.length || filled(a.other)){ B.push(X(`<p><b>Other specific requests:</b></p>`, `<p><b>其他具体要求：</b></p>`)); reqs.forEach(r=>B.push(`<p class="indent">${esc(r)}</p>`)); paras(userText('other')).forEach(p=>B.push(p.replace('<p>','<p class="indent">'))); } }
    B.push(PART('APPOINTMENT OF HEALTH CARE REPRESENTATIVE','指定医疗代表'));
    B.push(X(`<p>I appoint ${F(a.rep,200)} to be my health care representative. If my attending physician or advanced practice registered nurse determines that I am unable to understand and appreciate the nature and consequences of health care decisions and unable to reach and communicate an informed decision regarding treatment, my health care representative is authorized to make any and all health care decisions for me, including (1) the decision to accept or refuse any treatment, service or procedure used to diagnose or treat my physical or mental condition, except as otherwise provided by law such as for psychosurgery or shock therapy, as defined in section 17a-540, and (2) the decision to provide, withhold or withdraw life support systems. I direct my health care representative to make decisions on my behalf in accordance with my wishes, as stated in this document or as otherwise known to my health care representative. In the event my wishes are not clear or a situation arises that I did not anticipate, my health care representative may make a decision in my best interests, based upon what is known of my wishes.</p>`,
      `<p>我指定 ${F(a.rep,160)} 为我的医疗代表。如果我的主治医生或高级执业注册护士认定我无法理解和认识医疗决定的性质和后果，也无法就治疗作出并表达知情决定，我的医疗代表有权为我作出任何及所有医疗决定，包括：(1) 决定接受或拒绝用于诊断或治疗我身体或精神状况的任何治疗、服务或程序，但法律另有规定者除外，例如第 17a-540 条所定义的精神外科手术或电休克治疗；以及 (2) 决定提供、不予或撤除维生系统。我指示我的医疗代表依照本文件所述、或其所知的我的意愿，代我作出决定。如果我的意愿不明确，或出现我未曾预料的情况，我的医疗代表可以根据所知的我的意愿，以我的最大利益作出决定。</p>`));
    B.push(X(`<p>If ${F(a.rep,180)} is unwilling or unable to serve as my health care representative, I appoint ${F(a.alt,180)} to be my alternative health care representative.</p>`,

      `<p>如果需要为我指定人身监护人，我指定由 ${F(a.consName,160)} 担任我的监护人。如果 ${F(a.consName,140)} 不愿意或无法担任我的监护人，我指定 ${F(a.consAlt,160)} 为继任监护人。在任何司法管辖区，均不要求他们中任何一人提供保证金。</p>`));

        `<p style="margin-bottom:4px">I hereby make this anatomical gift, if medically acceptable, to take effect upon my death.</p><p style="margin-bottom:4px">I give: (check one)</p><p class="indent" style="margin-bottom:4px">${g('any')}(1) any needed organs or parts</p><p class="indent">${g('some')}(2) only the following organs or parts ${a.gift==='some'?F(parts):'<span class="blank"></span>'}</p><p style="margin-bottom:4px">to be donated for: (check one)</p><p class="indent" style="margin-bottom:4px">(1) ${p('any')}any of the purposes stated in subsection (a) of section 19a-289j</p><p class="indent">(2) ${p('limited')}these limited purposes ${a.giftPurpose==='limited'?F(purposes):'<span class="blank"></span>'}</p>`,
        `<p style="margin-bottom:4px">如果医学上可以接受，我在此作出以下器官捐赠，于我死亡时生效。</p><p style="margin-bottom:4px">我捐赠：（勾选一项）</p><p class="indent" style="margin-bottom:4px">${g('any')}(1) 任何需要的器官或组织</p><p class="indent">${g('some')}(2) 只捐赠以下器官或组织 ${a.gift==='some'?F(parts):'<span class="blank"></span>'}</p><p style="margin-bottom:4px">捐赠用途：（勾选一项）</p><p class="indent" style="margin-bottom:4px">(1) ${p('any')}第 19a-289j 条 (a) 款所述的任何用途</p><p class="indent">(2) ${p('limited')}只限以下用途 ${a.giftPurpose==='limited'?F(purposes):'<span class="blank"></span>'}</p>`));

    B.push(`<h4 class="part">${X('SIGNATURE','签名')}</h4>`);

      `<p>以上要求、指定和指派，是我在神智清醒时经过慎重考虑后作出的。任何收到本文件经正式签署的副本或传真件的人，均可依赖本文件，除非其已实际收到我撤销本文件的通知。</p>`));

      `<p>本文件由订立人 ${F(a.name,160)} 在我们面前签署。签署时，订立人看起来年满十八岁、神智清醒，能够理解医疗决定的性质和后果，且看起来未受到任何不当影响。我们在订立人面前、应订立人的要求，并在彼此面前签署了本文件。</p>`));

      `<p>我们，即签名见证人，经正式宣誓后声明：我们见证了订立人签署这些医疗指示、医疗代表的指定${hasCons?'、未来失能时监护人的指定':''}${hasGift?'以及器官捐赠文件':''}；订立人在我们面前签署、公布并声明这是其指示${hasCons?'、指定和指派':'和指定'}；我们随后在订立人面前、应订立人的要求，并在彼此面前作为见证人签署了本文件；签署时，订立人在我们看来年满十八岁、神智清醒、能够理解该文件的性质和后果，且未受到任何不当影响。我们应订立人的要求，于 20<span class="blank" style="min-width:24px"></span> 年 <span class="blank" style="min-width:40px"></span> 月 <span class="blank" style="min-width:40px"></span> 日作出本宣誓书。</p>`));

    B.push(X(`<p>Subscribed and sworn to before me this <span class="blank" style="min-width:40px"></span> day of <span class="blank" style="min-width:90px"></span> 20<span class="blank" style="min-width:24px"></span>.</p>`, `<p>于 20<span class="blank" style="min-width:24px"></span> 年 <span class="blank" style="min-width:40px"></span> 月 <span class="blank" style="min-width:40px"></span> 日在我面前签署并宣誓。</p>`) + `<div class="sig">${sigCell(X('Commissioner of the Superior Court / Notary Public','高等法院专员 / 公证人'))}${sigCell(X('My commission expires','执照到期日'))}</div><p class="note">${X('(Print or type name of all persons signing under all signatures)','（所有签名者请在签名下方以印刷体或打字写上姓名）')}</p>`);
    if(zh) return {blocks:B};
    const repZh = a.rep ? '（'+esc(a.rep)+'）' : '', repEn = a.rep ? ' ('+esc(a.rep)+')' : '';
    const ins = instructionBlocks('Health Care Instructions / Appointment of Health Care Representative (Conn. Gen. Stat. § 19a-575a)', [
      ['找两位年满 18 岁的成年人当见证人。<b>您指定的医疗代表'+repZh+'不能当见证人。</b>','Two adult witnesses are required. Your health care representative'+repEn+' may not serve as a witness.'],
      ['三人在场：您先在 "Signature of author" 处签名并写日期，两位见证人随后在见证栏签名，并填写印刷体姓名和<b>他们自己的住址</b>（不是签名的地点），方便以后需要时找到他们。','With all three present, sign and date at "Signature of author"; then both witnesses sign, print their names, and write <b>their own home addresses</b> (not where the signing takes place) so they can be located later if needed.'],
      ['（可选）最后一页是 "Witnesses\' Affidavit"（见证人宣誓书）。两位见证人一起在公证人面前签名，公证人盖章。以后如果有人质疑这份文件，就不必再找见证人出面作证。<b>可以事后补签，但建议当天一起完成</b>：带两位见证人去银行或 UPS 店，按"您签名 → 见证人签名 → 见证人签宣誓书 → 公证人盖章"的顺序一次办好。宣誓书上公证人执照的到期日，不会让文件失效。','Optional: the last page is the Witnesses\' Affidavit. Both witnesses sign it together before a notary public or Commissioner of the Superior Court, so they will not need to testify later if the document is questioned. It can be signed later, but doing everything the same day is best (for example at a bank): you sign, the witnesses sign, the witnesses sign the affidavit, and the notary completes it. The notary\'s commission expiration date does not affect the validity of your document.'],
      ['把副本交给医疗代表、后备代表、家庭医生和常去的医院，原件放在家人知道的地方，不要锁在保险箱里。','Give copies to your representative(s), physician and hospital. Keep the original somewhere accessible, not in a safe-deposit box.'],
      ['这份文件会撤销您以前签过的医疗预嘱和医疗代表指定。请收回或销毁旧文件的所有副本，并把新文件交给医生和医院。医生在不知道已撤销的情况下照旧文件执行，是不用负责的，所以一定要通知到位。','This document revokes your earlier advance directives and appointments. Collect or destroy all copies of old documents and give the new one to your doctors and hospital — providers who do not know of a revocation may still follow the old document.'],
      ['日后想撤销或更换医疗代表，必须书面撤销，由您本人和两位见证人签名；最简单的做法就是重新签一份新的。生前预嘱（维生治疗意愿）则可以随时以任何方式撤销。离婚或法定分居时，对配偶的指定会自动撤销。','To revoke or replace your representative later, do so in writing signed by you and two witnesses — signing a new document is the simplest way. Your living will can be revoked at any time in any manner. Appointment of a spouse is revoked by divorce or legal separation.']
    ]);
    return {blocks:B, instructions:ins, file:'Advance-Directive-CT'};
  }

      {k:'cons', t:'radio', label:{zh:'如果将来法院需要为您指定"财产监护人"，是否预先提名？', en:'If a court ever needs to appoint a conservator of your estate, do you want to name one now?'}, req:true, help:{zh:'<b>财产监护人</b>管的是您的钱和财产，由<b>法院</b>指定。<br>• 您签了财务授权书，通常就用不到监护人；只有在家人起争议、代理人无法担任或被告上法院时，法院才会介入。<br>• 法院原则上会指定您在这里提名的人，除非他不愿意、做不到，或被证明不适合（例如滥用权力）。<br>• 不提名的话，法院可能指定您不认识的人。<br>很多人会填写和代理人同一人。', en:'A <b>conservator of the estate</b> manages your money and property and is appointed by a <b>court</b>.<br>• With a power of attorney you usually never need one; a court steps in only if there is a family dispute, or your agent cannot serve or is taken to court.<br>• The court will appoint the person you name here unless they are unwilling, unable, or shown to be unfit (for example, for abusing their authority).<br>• If you name no one, the court may appoint someone you do not know.<br>Many people name the same person as their agent.'}, opts:[{v:'yes',zh:'是',en:'Yes'},{v:'no',zh:'否，留空',en:'No, leave blank'}]},
      {k:'cons1Same', t:'radio', label:{zh:'财产监护人是否就是您的代理人？', en:'Is the conservator the same person as your agent?'}, show:a=>a.cons==='yes', req:true, opts:[{v:'same', zh:'是，同一人（自动填入代理人的姓名）', en:'Yes, the same person (filled in automatically)'},{v:'other', zh:'否，另外指定一位', en:'No, someone else'}]},
      {k:'cons1Info', t:'info', show:a=>a.cons==='yes' && a.cons1Same==='same', html:a=>({zh:'财产监护人将填入：<b>'+(filled(a.agent1)?esc(a.agent1):'（请先在第 2 步填写代理人）')+'</b>', en:'Conservator will be: <b>'+(filled(a.agent1)?esc(a.agent1):'(enter your agent in step 2 first)')+'</b>'})},
      {k:'cons1', t:'text', nm:true, label:{zh:'财产监护人英文全名', en:'Conservator of estate – full name'}, show:a=>a.cons==='yes' && a.cons1Same==='other', req:true},
      {k:'cons2Same', t:'radio', label:{zh:'后备财产监护人', en:'Alternate conservator'}, show:a=>a.cons==='yes', req:true, help:{zh:'建议填写<b>另一位</b>您信任的人。如果第一人无法担任或被法院认定不适合，法院会优先考虑这一位。', en:'We suggest a <b>different</b> person you trust. If your first choice cannot serve or is found unfit, the court will consider this person first.'}, opts:[{v:'same', zh:'与后备代理人同一人（自动填入）', en:'Same as my successor agent (filled in automatically)'},{v:'other', zh:'另外指定一位', en:'Someone else'},{v:'none', zh:'不指定', en:'None'}]},
      {k:'cons2Info', t:'info', show:a=>a.cons==='yes' && a.cons2Same==='same', html:a=>({zh:'后备财产监护人将填入：<b>'+(filled(a.succ1)?esc(a.succ1):'（您还没有填写后备代理人，请回第 4 步填写）')+'</b>', en:'Alternate conservator will be: <b>'+(filled(a.succ1)?esc(a.succ1):'(you have not entered a successor agent — see step 4)')+'</b>'})},
      {k:'cons2', t:'text', nm:true, label:{zh:'后备财产监护人英文全名', en:'Alternate conservator – full name'}, show:a=>a.cons==='yes' && a.cons2Same==='other'},
      {k:'bond', t:'radio', label:{zh:'是否要求监护人提供保证金（bond）？', en:'Should the conservator be required to post a bond?'}, show:a=>a.cons==='yes', req:true, opts:[{v:'not',zh:'不要求（常见选择，可省费用）',en:'Not required (common; saves cost)'},{v:'be',zh:'要求',en:'Required'}]}
    ]}
  ],
  build(a, zh=false){
    const X = (en, c) => zh ? c : en;
    const userText = k => zh && filled(a[k+'_zh']) ? a[k+'_zh'] : a[k];
    const agents = a.two==='yes' ? `${esc(a.agent1||'')}, ${esc(A(a.agent1addr))}; ${X('and','以及')} ${esc(a.agent2||'')}, ${esc(A(a.agent2addr))}` : `${esc(a.agent1||'')}, ${esc(A(a.agent1addr))}`;
    const howZh = {severally:'各自单独（severally）', jointly:'共同（jointly）'};
    const B = [];
    B.push(`<div class="ttl">${X('DURABLE STATUTORY POWER OF ATTORNEY - SHORT FORM','持久法定授权书 – 短版')}</div>`);
    B.push(X(`<div class="boxed"><p style="margin:0"><b>Notice:</b> The powers granted by this document are broad and sweeping. They are defined in the Connecticut Uniform Power of Attorney Act, which expressly permits the use of any other or different form of power of attorney desired by the parties concerned. The grantor of any power of attorney or the agent may make application to a Probate Court for an accounting as provided in subsection (d) of section 45a-175 of the general statutes. This power of attorney does not authorize the agent to make health care decisions for you.</p></div>`,
      `<div class="boxed"><p style="margin:0"><b>注意：</b>本文件授予的权力范围广泛而全面。这些权力由《康涅狄格州统一授权书法》定义，该法明确允许当事人使用其希望的任何其他或不同格式的授权书。任何授权书的授予人或代理人，均可依照康州法规第 45a-175 条 (d) 款，向遗嘱认证法院申请查账。本授权书并不授权代理人为您作出医疗决定。</p></div>`));
    B.push(X(`<p>Know All Persons by These Presents, which are intended to constitute a GENERAL POWER OF ATTORNEY pursuant to the Connecticut Uniform Power of Attorney Act:</p>`,
      `<p>兹告知所有人，本文件拟依照《康涅狄格州统一授权书法》构成一份<b>一般授权书</b>：</p>`));
    const how = a.two==='yes' ? F(zh ? (howZh[a.how]||'') : a.how, 80) : '<span class="blank" style="min-width:80px"></span>';
    B.push(X(`<p>That I <span class="fill">${esc(a.name||'')}, ${esc(A(a.addr))}</span> do hereby appoint <span class="fill">${agents}</span> my agent(s) TO ACT ${how}.</p>`,
      `<p>本人 <span class="fill">${esc(a.name||'')}，${esc(A(a.addr))}</span>，特此指定 <span class="fill">${agents}</span> 为我的代理人，${how} 行事。</p>`));
    B.push(X(`<p class="note">If more than one agent is designated and the principal wishes each agent alone to be able to exercise the power conferred, insert in this blank the word 'severally'. Failure to make any insertion or the insertion of the word 'jointly' shall require the agents to act jointly.</p>`,
      `<p class="note">如果指定了一位以上的代理人，且授权人希望每位代理人都能单独行使所授予的权力，请在空白处填入 'severally'（各自单独）。如果不填写，或填入 'jointly'（共同），代理人必须共同行事。</p>`));
    B.push(X(`<p>First: In my name, place and stead in any way which I myself could do, if I were personally present, with respect to the following matters as each of them is defined in the Connecticut Uniform Power of Attorney Act to the extent that I am permitted by law to act through an agent:</p>`,
      `<p>第一：以我的名义、代表我，就以下各项事项（每一项均按《康涅狄格州统一授权书法》的定义），在法律允许我通过代理人行事的范围内，以我本人亲自在场时可以采取的任何方式行事：</p>`));
    B.push(X(`<p class="note">(Strike out and initial in the opposite box any one or more of the subparagraphs as to which the principal does NOT desire to give the agent authority. Such elimination of any one or more of subparagraphs (A) to (M), inclusive, shall automatically constitute an elimination also of subparagraph (N).)<br>To strike out any subparagraph the principal must draw a line through the text of that subparagraph AND write his initials in the box opposite.</p>`,
      `<p class="note">（对于授权人<b>不</b>希望授予代理人权力的任何一项或多项分项，请划掉，并在对面的方框内写上姓名缩写。删除 (A) 至 (M) 中的任何一项或多项，将自动同时删除 (N) 项。）<br>要划掉任何分项，授权人必须在该分项的文字上划一条线，<b>并</b>在对面的方框内写上姓名缩写。</p>`));
    B.push(`<table style="font-size:12.5px;width:78%;margin-left:6%">${POWERS.map(p=>`<tr><td style="width:40px;border:0">(${p[0]})</td><td style="border:0">${zh ? p[2] : p[1]+';'}</td><td style="width:58px;border:0;text-align:right">(&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;)</td></tr>`).join('')}</table>`);
    const spList = [
      ...(a.revoke==='all' ? [X('<p>I revoke all powers of attorney previously executed by me, other than any document appointing a health care representative or concerning health care decisions.</p>', '<p>我撤销我以前签署的所有授权书，但任何指定医疗代表或涉及医疗决定的文件除外。</p>')] : []),
      ...pickLabels(POA_SPECIAL, a.specialOpts, zh ? 'zh' : 'pdf').map(x=>`<p>${esc(zh ? x+'。' : x)}</p>`),
      ...paras(userText('special'))];
    const sp = spList.length ? spList.join('') : '<div class="sigline"></div><div class="sigline"></div><div class="sigline"></div>';
    B.push(`<p style="margin-bottom:2px"><b>${X('Special instructions:','特别说明：')}</b></p><div class="indent">${sp}</div>`);
    B.push(X(`<p class="note">(Special provisions and limitations may be included in the statutory form power of attorney only if they conform to the requirements of the Connecticut Uniform Power of Attorney Act.)</p>`,
      `<p class="note">（只有在符合《康涅狄格州统一授权书法》要求的情况下，才可以在法定格式授权书中加入特别条款和限制。）</p>`));
    B.push(X(`<p>Second: LIMITATION ON AGENT'S AUTHORITY</p><p>An agent MAY NOT use my property to benefit the agent or a dependent of the agent unless I have included that authority in any special instructions below.</p>`,
      `<p>第二：代理人权力的限制</p><p>代理人<b>不得</b>使用我的财产让代理人本人或其受扶养人受益，除非我在下方的任何特别说明中授予了该项权力。</p>`));
    B.push(X(`<p>Third: Hereby ratifying and confirming all that said agent(s) or substitute(s) do or cause to be done.</p>`,
      `<p>第三：特此追认并确认上述代理人或其替代人所做或促使完成的一切事项。</p>`));
    B.push(X(`<p>Fourth: With full and unqualified authority to exercise or delegate any or all of the foregoing powers granted under this power of attorney to any person or persons whom my agent(s) shall select.</p>`,
      `<p>第四：代理人具有完全且无条件的权力，可以行使本授权书所授予的上述任何或全部权力，或将其转授给代理人所选定的任何人。</p>`));
    B.push(X(`<p>Fifth: DESIGNATION OF SUCCESSOR AGENT(S) (OPTIONAL)</p><p>If my agent is unable or unwilling to act for me, I name as my successor agent:<br>Name of Successor Agent: ${F(a.succ1,220)}<br>Successor Agent's Address: ${F(A(a.succ1addr),260)}</p><p>If my successor agent is unable or unwilling to act for me, I name as my second successor agent:<br>Name of Second Successor Agent: ${F(a.succ2,220)}<br>Second Successor Agent's Address: ${F(A(a.succ2addr),260)}</p>`,
      `<p>第五：指定继任代理人（可选）</p><p>如果我的代理人无法或不愿意为我行事，我指定以下人士为继任代理人：<br>继任代理人姓名：${F(a.succ1,220)}<br>继任代理人地址：${F(A(a.succ1addr),260)}</p><p>如果我的继任代理人无法或不愿意为我行事，我指定以下人士为第二继任代理人：<br>第二继任代理人姓名：${F(a.succ2,220)}<br>第二继任代理人地址：${F(A(a.succ2addr),260)}</p>`));
    const yes = a.cons==='yes';
    const bondBe = `<span class="ck">${yes&&a.bond==='be'?'✓':''}</span>`, bondNot = `<span class="ck">${yes&&a.bond==='not'?'✓':''}</span>`;
    B.push(X(`<p>Sixth: DESIGNATION OF CONSERVATOR OF ESTATE (OPTIONAL)</p><p>If a conservator of my estate should be appointed, I designate that ${F(yes?a.cons1:'',180)} be appointed to serve as conservator of my estate. If ${F(yes?a.cons1:'',160)} is unable to serve or cease to serve as conservator of my estate, I designate that ${F(yes?a.cons2:'',180)} be appointed to serve as conservator of my estate.</p><p>I direct that bond for the conservator of my estate, including any sureties thereon ${bondBe}be required ${bondNot}not be required.</p>`,
      `<p>第六：指定财产监护人（可选）</p><p>如果需要为我指定财产监护人，我指定由 ${F(yes?a.cons1:'',160)} 担任我的财产监护人。如果 ${F(yes?a.cons1:'',140)} 无法担任或停止担任我的财产监护人，我指定由 ${F(yes?a.cons2:'',160)} 担任我的财产监护人。</p><p>我指示，财产监护人的保证金（包括其担保人）${bondBe}须提供 ${bondNot}无须提供。</p>`));
    B.push(X(`<p>Seventh: EFFECTIVE DATE</p><p>This power of attorney is effective immediately unless I have stated otherwise in the special instructions.</p><p>The execution of this statutory short form power of attorney shall be duly acknowledged by the principal in the manner prescribed for the acknowledgment of a conveyance of real property.</p>`,
      `<p>第七：生效日期</p><p>本授权书立即生效，除非我在特别说明中另有规定。</p><p>本法定短版授权书的签署，应由授权人按照不动产转让认证的规定方式正式确认（公证）。</p>`));
    B.push(X(`<p>In Witness Whereof I have hereunto signed my name and affixed my seal this <span class="blank" style="min-width:40px"></span> day of <span class="blank" style="min-width:100px"></span>, 20<span class="blank" style="min-width:24px"></span>.</p>`,
      `<p>为此，我于 20<span class="blank" style="min-width:24px"></span> 年 <span class="blank" style="min-width:40px"></span> 月 <span class="blank" style="min-width:40px"></span> 日在此签名并盖印。</p>`) + `<div class="sig">${sigCell(X('Signature of Principal (Seal)','授权人签名（盖印）'))}<div class="siglbl" style="padding-top:14px">${X('Printed name','印刷体姓名')}: <b>${esc(a.name||'')}</b></div></div>`);
    B.push(`<div class="sig">${sigCell(X('Witness','见证人'))}${sigCell(X('Witness','见证人'))}${sigCell(X('Printed name','印刷体姓名'))}${sigCell(X('Printed name','印刷体姓名'))}</div>`);
    B.push(X(`<p style="margin-top:12px">STATE OF <span class="blank"></span> &nbsp;}&nbsp; ss: <span class="blank" style="min-width:90px"></span><br>COUNTY OF <span class="blank"></span></p><p>On this the <span class="blank" style="min-width:40px"></span> day of <span class="blank" style="min-width:100px"></span>, 20<span class="blank" style="min-width:24px"></span>, before me, ${F(a.name,200)}, signer of the foregoing instrument, personally appeared, and acknowledged the execution of such instrument to be his/her free act and deed.</p>`,
      `<p style="margin-top:12px"><span class="blank"></span> 州 &nbsp;}&nbsp; ss: <span class="blank" style="min-width:90px"></span><br><span class="blank"></span> 县</p><p>20<span class="blank" style="min-width:24px"></span> 年 <span class="blank" style="min-width:40px"></span> 月 <span class="blank" style="min-width:40px"></span> 日，上述文件的签署人 ${F(a.name,160)} 亲自到我面前，承认签署该文件是其本人的自愿行为。</p>`) + `<div class="sig">${sigCell(X('Commissioner of the Superior Court / Notary Public','高等法院专员 / 公证人'))}${sigCell(X('My commission expires','执照到期日'))}</div>`);
    if(zh) return {blocks:B};
    const struck = (a.strike||[]);
    const strikeTxt = struck.length ? '签名前，请亲手在以下项目的文字上<b>划一条线</b>，并在右侧括号里写上您的姓名缩写：'+struck.map(s=>'('+s+')').join('、')+'，以及 (N)。' : '您选择了授权全部 (A)–(N) 项，所以不需要划掉任何项目。右侧括号保持空白即可。';
    const strikeEn = struck.length ? 'Before signing, draw a line through the text of, and write your initials in the box beside: '+struck.map(s=>'('+s+')').join(', ')+' and (N).' : 'You are granting all powers (A)–(N). Do not strike anything; leave the boxes blank.';
    const ins = instructionBlocks('Durable Statutory Power of Attorney – Short Form (Conn. Gen. Stat. § 1-352)', [
      [strikeTxt, strikeEn],
      ['找两位见证人和一位公证人（Notary Public）。银行、UPS 店、律师事务所通常都有公证服务。<b>代理人不要当见证人。</b>','You need two witnesses and a notary public (banks, UPS stores and law offices often offer notary service). Your agent should not act as a witness.'],
      ['在三人面前签名并写日期，两位见证人随后签名并写上印刷体姓名，公证人最后填写公证部分。','Sign and date in front of them; the witnesses sign and print their names; the notary completes the acknowledgment.'],
      ['如果代理人将来要用这份授权书处理房地产，可能需要到房产所在镇的 Town Clerk 登记（record）。','If your agent will use it for real estate, it may need to be recorded with the Town Clerk where the property is located.'],
      ['把原件交给代理人，或告诉代理人原件放在哪里。日后想撤销，请书面撤销并通知代理人和相关银行。','Give the original to your agent or tell them where it is kept. To revoke, do so in writing and notify your agent and institutions.']
    ].concat(a.revoke==='all' ? [
      ['这份授权书撤销了您以前所有的财务授权书。请<b>书面通知以前的代理人</b>，收回旧文件，并通知曾经收过旧授权书的银行和机构，否则他们可能继续按旧授权书办事。','This document revokes your earlier powers of attorney. Notify your former agents in writing, collect the old documents, and tell any bank or institution that has a copy; otherwise they may continue to rely on it.']
    ] : []));
    return {blocks:B, instructions:ins, file:'Power-of-Attorney-CT'};
  }
});

    return {blocks:B, instructions:ins, file:'Letter-of-Instruction'};
  }
});

  const crumb = `<div class="crumb"><a href="#home">${T('← 全部文件','← All documents')}</a> &nbsp;/&nbsp; ${t(d.name)}</div>`;

    app.innerHTML = crumb + `
    <h1>${t(d.name)}</h1>
    ${LANG==='zh'?`<p class="official-h">英文正式名称：${d.official}</p>`:''}

    <section class="block"><h3>${T('谁需要','Who needs it')}</h3><p>${t(i.who)}</p></section>

    <section class="block"><h3>${T('开始前请准备','Before you start')}</h3><ul>${i.need.map(n=>`<li>${t(n)}</li>`).join('')}</ul>
      <div class="btn-row"><button class="btn accent" id="start">${Object.keys(a).length?T('继续填写 →','Continue →'):T('开始填写 →','Start →')}</button>
      <label class="btn secondary" style="cursor:pointer">${T('载入答案档','Load an answer file')}<input type="file" accept=".json,application/json" id="load" hidden></label></div>
    </section>`;
    $('#start').onclick = ()=>{ VIEW.step=0; renderDoc(d); window.scrollTo(0,0); };
    $('#load').onchange = e => loadAnswers(e, d);
    return;
  }
  if(VIEW.step >= S){ return renderReview(d); }
  const step = d.steps[VIEW.step];
  app.innerHTML = crumb + `
    <h1 style="font-size:28px">${t(d.name)}${LANG==='zh'?` <span class="official-s">${d.official}</span>`:''}</h1>
    <div class="progress">${d.steps.map((_,i)=>`<span class="${i<=VIEW.step?'on':''}"></span>`).join('')}<span></span></div>
    <p class="stepmeta">${T(`第 ${VIEW.step+1} 步，共 ${S} 步`, `Step ${VIEW.step+1} of ${S}`)}</p>

      <div class="btn-row"><button class="btn secondary" id="back">${T('← 上一步','← Back')}</button><button class="btn" id="next">${VIEW.step===S-1?T('预览文件 →','Preview →'):T('下一步 →','Next →')}</button></div>
    </section>`;
  const form = $('#f');
  const draw = () => { form.innerHTML = visibleFields(step,a).map(f=>fieldHTML(f,a)).join(''); bind(form, step, a, draw); };
  draw();
  $('#back').onclick = e=>{ e.preventDefault(); VIEW.step--; renderDoc(d); window.scrollTo(0,0); };
  $('#next').onclick = e=>{ e.preventDefault(); if(validate(form, step, a)){ VIEW.step++; renderDoc(d); window.scrollTo(0,0);} };

function fieldHTML(f, a){
  const nmHint = f.nm ? `<p class="help">${T('请照着驾照或护照上的英文拼法填写，例如：Mei Ling Wang','Spell it exactly as on the driver\'s license or passport, e.g. Mei Ling Wang')}</p>` : '';
  const sharedNote = f.shared ? `<p class="help" style="color:var(--brand-2)">${T('🔗 与首页"我的基本资料"共用，修改后其他文件会同步。','🔗 Shared with "My basic information" on the home page; changes sync to other documents.')}</p>` : '';
  const lbl = `<span class="lbl">${t(f.label)}${f.req?' <span style="color:#b42318">*</span>':''}</span>${nmHint}${sharedNote}${f.help?`<p class="help">${t(f.help)}</p>`:''}`;
  const v = a[f.k];
  if(f.t==='text' || f.t==='date') return `<div class="field" data-k="${f.k}">${lbl}<input type="${f.t}" name="${f.k}" value="${esc(v||'')}" placeholder="${esc(t(f.ph) || (f.nm?'Mei Ling Wang':''))}"></div>`;
  if(f.t==='address'){
    const o = (v && typeof v==='object') ? v : {st: v||''};
    const sub = (key, zh, en, ph, cls) => `<div class="${cls||''}"><label>${T(zh,en)}</label><input type="text" data-ad="${key}" value="${esc(key==='state' ? (o.state ?? 'CT') : (o[key]||''))}" placeholder="${esc(ph)}"></div>`;
    return `<div class="field addr" data-k="${f.k}">${lbl}<p class="help">${T('请用英文填写，和信件上的地址一样。','Use the same address you receive mail at.')}</p><div class="addr-grid">${sub('st','门牌号码和街道','Street address','123 Main St, Apt 4','wide')}${sub('city','城市','City','Hartford')}${sub('state','州','State','CT','narrow')}${sub('zip','邮编','ZIP code','06103','narrow')}</div></div>`;
  }
  if(f.t==='trtext'){
    const en = `<textarea name="${f.k}" placeholder="${esc(t(f.ph))}">${esc(v||'')}</textarea>`;
    if(LANG==='en') return `<div class="field" data-k="${f.k}">${lbl}${en}</div>`;

  }
  if(f.t==='textarea') return `<div class="field" data-k="${f.k}">${lbl}<textarea name="${f.k}" placeholder="${esc(t(f.ph))}">${esc(v||'')}</textarea></div>`;
  if(f.t==='radio') return `<div class="field" data-k="${f.k}">${lbl}${f.opts.map(o=>`<label class="opt ${v===o.v?'sel':''}"><input type="radio" name="${f.k}" value="${esc(o.v)}" ${v===o.v?'checked':''}><span>${t(o)}</span></label>`).join('')}</div>`;
  if(f.t==='checks') { const arr=v||[]; return `<div class="field" data-k="${f.k}">${lbl}${f.opts.map(o=>`<label class="opt ${arr.includes(o.v)?'sel':''}"><input type="checkbox" name="${f.k}" value="${esc(o.v)}" ${arr.includes(o.v)?'checked':''}><span>${t(o)}</span></label>`).join('')}</div>`; }
  if(f.t==='info') return `<div class="field infobox">${t(typeof f.html==='function' ? f.html(a) : f.html)}</div>`;
  if(f.t==='matrix'){
    const m = v || {};
