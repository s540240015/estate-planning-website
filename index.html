}

function bind(form, step, a, redraw){
  const sig = () => visibleFields(step,a).map(f=>f.k).join('|');
  const cur = sig();
  form.querySelectorAll('input[type=text],input[type=date],textarea').forEach(el=>{ if(el.dataset.c || el.dataset.ad) return; el.addEventListener('input',()=>{ a[el.name]=el.value; if(CUR_DOC) pushShared(CUR_DOC, el.name, el.value); persist(); if(sig()!==cur){ const n=el.name; redraw(); const again=form.querySelector(`[name="${n}"]`); if(again){ again.focus(); try{ const L=again.value.length; again.setSelectionRange(L,L);}catch(e){} } } }); });
  form.querySelectorAll('input[type=radio]').forEach(el=>el.addEventListener('change',()=>{
    if(el.dataset.m){ const k=el.dataset.m; a[k]=Object.assign({}, a[k]||{}, {[el.dataset.i]:el.value}); persist();
      const card=el.closest('.mx'); card.classList.add('done'); card.querySelectorAll('.mx-o').forEach(o=>o.classList.toggle('sel', o.querySelector('input').checked)); return; }
    a[el.name]=el.value; persist(); redraw(); }));
  form.querySelectorAll('input[type=checkbox]').forEach(el=>el.addEventListener('change',()=>{ const k=el.name; a[k]=[...form.querySelectorAll(`input[name="${k}"]:checked`)].map(x=>x.value); persist(); redraw(); }));
  form.querySelectorAll('.field.addr').forEach(box=>{
    const k=box.dataset.k;
    const sync=()=>{ const o={}; box.querySelectorAll('[data-ad]').forEach(i=>o[i.dataset.ad]=i.value.trim()?i.value:''); a[k]=o; if(CUR_DOC) pushShared(CUR_DOC, k, o); persist(); };
    box.querySelectorAll('[data-ad]').forEach(i=>i.addEventListener('input',sync));
    if(!a[k] || typeof a[k]==='string') sync();
  });
  form.querySelectorAll('[data-tr]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const k=btn.dataset.tr, st=form.querySelector('#trs-'+k), src=form.querySelector(`[name="${k}_zh"]`), dst=form.querySelector(`[name="${k}"]`);
    if(!src.value.trim()){ st.textContent='请先在左边用中文写下内容。'; return; }
    btn.disabled=true; st.textContent='正在翻译…';
    try{ const out = await translateZhEn(src.value, st); dst.value=out; a[k]=out; persist(); st.textContent='✓ 已翻译，请检查右边的英文。'; }
    catch(e){ st.innerHTML = e && e.message==='slow' ? '翻译模型下载时间较长，请确认网络连线，稍后再按一次。' : e && e.message==='unsupported' ? '这个浏览器不支持内置翻译。请用<b>电脑版 Chrome</b>（138 版或更新）打开本网站，或请懂英文的家人帮忙在右边填写英文。' : '翻译失败：'+esc(e && e.message || e); }
    finally{ btn.disabled=false; }
  }));
  form.querySelectorAll('.mx-q').forEach(btn=>btn.addEventListener('click',()=>{
    const f = step.fields.find(x=>x.t==='matrix'); const m = Object.assign({}, a[f.k]||{});
    f.items.filter(it=>it.g===btn.dataset.grp).forEach(it=>m[it.v]=btn.dataset.val); a[f.k]=m; persist();
    const y=window.scrollY; redraw(); window.scrollTo(0,y); }));
  form.querySelectorAll('.rows').forEach(box=>{
    const k = box.dataset.k;
    const sync = () => { a[k] = [...box.querySelectorAll('.row')].map(row=>{ const o={}; row.querySelectorAll('[data-c]').forEach(i=>o[i.dataset.c]=i.value); return o; }); persist(); };
    box.querySelectorAll('[data-c]').forEach(i=>{ i.addEventListener('input', sync); i.addEventListener('change', sync); });
    const add = box.querySelector('[data-add]'); if(add) add.onclick = ()=>{ sync(); a[k].push({}); persist(); redraw(); };
    box.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ sync(); a[k].splice(+b.dataset.rm,1); persist(); redraw(); });
  });
}

function isFilled(f, a){
  const v = a[f.k];
  if(f.t==='matrix') return f.items.every(it=>(v||{})[it.v]);
  if(f.t==='info') return true;
  if(f.t==='address'){ const o=v||{}; return typeof o==='string' ? filled(o) : (filled(o.st)&&filled(o.city)&&filled(o.zip)); }
  if(f.t==='rows') return (v||[]).some(r=>Object.values(r).some(filled));
  if(f.t==='checks') return (v||[]).length>0;
  return filled(v);
}

function validate(form, step, a){
  form.querySelectorAll('.err').forEach(e=>e.remove());
  let ok = true, first=null;
  visibleFields(step,a).forEach(f=>{
    if(!f.req || isFilled(f,a)) return;
    ok=false; const box=form.querySelector(`[data-k="${f.k}"]`);
    if(box){ box.insertAdjacentHTML('beforeend',`<div class="err">${f.t==='matrix'?T('请为每一项都做出选择','Please make a choice for every treatment'):T('请填写这一项','This field is required')}</div>`); first = first||box; }
  });
  if(first) first.scrollIntoView({behavior:'smooth', block:'center'});
  return ok;
}

/* ---------- On-device translation (Chrome Translator API); nothing leaves the computer ---------- */
let _translator = null;
async function translateZhEn(text, statusEl){
  if(!('Translator' in self)) throw new Error('unsupported');
  const opts = {sourceLanguage:'zh', targetLanguage:'en'};
  const avail = await Translator.availability(opts);
  if(avail==='unavailable') throw new Error('unsupported');
  if(!_translator){
    if(avail!=='available' && statusEl) statusEl.textContent='第一次使用，需要下载翻译模型，请稍候…';
    try{
      const creating = Translator.create({...opts, monitor(m){ m.addEventListener('downloadprogress', e=>{ if(statusEl) statusEl.textContent='第一次使用，正在下载翻译模型… '+Math.round((e.loaded||0)*100)+'%'; }); }});
      _translator = await Promise.race([creating, new Promise((_,rej)=>setTimeout(()=>rej(new Error('slow')), 60000))]);
    }catch(e){
      if(e && e.message==='slow') throw e;
      if(e && (e.name==='NotAllowedError' || e.name==='NotSupportedError')) throw new Error('unsupported');
      throw e;
    }
  }
  const parts = text.split(/\n/);
  const out = [];
  for(const p of parts) out.push(p.trim() ? await _translator.translate(p) : '');
  return out.join('\n');
}

/* ---------- Pagination ---------- */
function paginate(blocks, title, opts={}){
  const root = $('#render-root'); root.innerHTML='';
  const pages=[]; let inner;
  const newPage = () => { const page=document.createElement('div'); page.className='page'+(opts.banner?' tr-page':''); inner=document.createElement('div'); inner.className='inner'; page.appendChild(inner); root.appendChild(page); pages.push(page); };
  newPage();
  blocks.forEach((b, idx)=>{
    if(b === '__PAGEBREAK__'){ if(inner.childNodes.length) newPage(); return; }
    if(opts.force && opts.force.has(idx) && inner.childNodes.length) newPage();
    const tmp=document.createElement('div'); tmp.innerHTML=b;
    const nodes=[...tmp.childNodes]; nodes.forEach(n=>{ n._bi = idx; });
    nodes.forEach(n=>inner.appendChild(n));
    if(inner.scrollHeight > inner.clientHeight+1 && inner.childNodes.length > nodes.length){
      nodes.forEach(n=>n.remove());
      const old = inner; let carry = [];
      let last = old.lastElementChild;
      while(last && last.tagName==='H4' && old.childElementCount>1){ carry.unshift(last); last.remove(); last = old.lastElementChild; }
      newPage(); carry.forEach(n=>inner.appendChild(n)); nodes.forEach(n=>inner.appendChild(n));
    }
  });
  const starts = pages.map(p=>{ const f = p.querySelector('.inner').firstChild; return f ? f._bi : -1; });
  pages.forEach((p,i)=>{
    if(opts.banner){ const bn=document.createElement('div'); bn.className='pbanner'; bn.innerHTML=opts.banner; p.appendChild(bn); }
    const f=document.createElement('div'); f.className='pfoot';
    f.innerHTML = opts.banner ? `<span>${esc(title)}</span><span>第 ${i+1} 页，共 ${pages.length} 页 · 对应英文原件第 ${i+1} 页</span>` : `<span>${esc(title)}</span><span>Initials: ________ &nbsp;&nbsp; Page ${i+1} of ${pages.length}</span>`;
    p.appendChild(f); });
  pages.starts = starts;
  return pages;
}

const DOC_EN_TITLE = {'advance-directive':'Advance Directive','power-of-attorney':'Durable Power of Attorney','hipaa':'HIPAA Authorization','final-wishes':'Letter of Final Wishes','letter-of-instruction':'Letter of Instruction','beneficiary-review':'Beneficiary Review'};
function buildAll(d){
  const r = d.build(syncShared(d));
  return {r, blocks:[...r.blocks, '__PAGEBREAK__', ...r.instructions]};
}
const HAS_ZH = id => ['advance-directive','power-of-attorney','hipaa'].includes(id);
const ZH_TITLE = {'advance-directive':'医疗预嘱','power-of-attorney':'持久财务授权书','hipaa':'病历授权书'};
const ZH_BANNER = '中文参考译本 · 仅供理解，不具法律效力 · 请签署英文原件<span class="pb-en">Chinese reference translation — not for signing</span>';
/* Paginate the Chinese translation so each page matches the same page of the English original */
function paginateTranslation(d){
  const a = syncShared(d), name = a.name||'';
  const en = paginate(d.build(a).blocks, `${DOC_EN_TITLE[d.id]} — ${name}`);
  const force = new Set(en.starts.slice(1).filter(x=>x>=0));
  return paginate(d.build(a, true).blocks, `中文参考译本 — ${ZH_TITLE[d.id]} — ${name}`, {force, banner:ZH_BANNER});
}

let PV_MODE = 'en';
async function drawPreview(d){
  const pv = $('#pv'); if(!pv) return;
  try { await document.fonts.ready; } catch(e){}
  let pages;
  if(PV_MODE==='zh' && HAS_ZH(d.id)) pages = paginateTranslation(d);
  else { const {blocks} = buildAll(d); pages = paginate(blocks, `${DOC_EN_TITLE[d.id]} — ${(ANSWERS[d.id]||{}).name||''}`); }
  const scale = Math.min(1, (pv.clientWidth-36)/816);
  pv.innerHTML='';
  pages.forEach(p=>{ const h=document.createElement('div'); h.className='pv-holder'; h.style.width=(816*scale)+'px'; h.style.height=(1056*scale)+'px'; const c=p.cloneNode(true); c.style.transform=`scale(${scale})`; h.appendChild(c); pv.appendChild(h); });
  $('#render-root').innerHTML='';
}

async function makePDF(d, zh=false){
  const btn = zh ? $('#pdfzh') : $('#pdf'); const label=btn.textContent; btn.disabled=true; btn.textContent=T('正在生成…','Generating…');
  try{
    if(!window.jspdf || !window.html2canvas) throw new Error(T('PDF 组件没有载入，请检查网络后重新整理页面。','The PDF library did not load. Check your connection and reload the page.'));
    await document.fonts.ready;
    const {r, blocks} = buildAll(d);
    const name = (ANSWERS[d.id]||{}).name||'';
    const pages = zh ? paginateTranslation(d) : paginate(blocks, `${DOC_EN_TITLE[d.id]} — ${name}`);
    const pdf = new window.jspdf.jsPDF({unit:'pt', format:'letter', compress:true});
    for(let i=0;i<pages.length;i++){
      btn.textContent=`${T('正在生成…','Generating…')} ${i+1}/${pages.length}`;
      const canvas = await window.html2canvas(pages[i], {scale:2.2, backgroundColor:'#ffffff', logging:false, useCORS:true});
      if(i) pdf.addPage('letter','portrait');
      pdf.addImage(canvas.toDataURL('image/jpeg',0.9),'JPEG',0,0,612,792,undefined,'FAST');
    }
    pdf.setProperties({title:`${DOC_EN_TITLE[d.id]} - ${name}`, creator:'Plan Ahead CT (self-help tool)'});
    const safe = name.replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-');
    await saveFile(`${r.file}${safe?'-'+safe:''}${zh?'-Chinese-Reference':''}.pdf`, pdf.output('blob'));
  }catch(e){ console.error(e); toast(T('生成失败：','Could not generate: ')+(e.message||e)); }
  finally{ btn.disabled=false; btn.textContent=label; $('#render-root').innerHTML=''; }
}

async function saveFile(filename, blob){
  // Inside a Claude artifact use the downloads capability; elsewhere a normal browser download.
  if(window.claude && typeof window.claude.use==='function'){
    try{
      const dl = await window.claude.use('downloads');
      if(dl){ await dl.save({filename, data:blob}); toast(T('已保存：','Saved: ')+filename); return; }
    }catch(e){
      if(e && e.code==='declined'){ toast(T('已取消下载。','Download cancelled.')); return; }
      if(e && e.code==='rate_limited'){ toast(T('请稍候再试。','Please wait a moment and try again.')); return; }
    }
  }
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a'); link.href=url; link.download=filename; document.body.appendChild(link); link.click(); link.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  toast(T('已下载：','Downloaded: ')+filename);
}

function loadAnswers(e, d){
  const file = e.target.files[0]; if(!file) return;
  const rd = new FileReader();
  rd.onload = () => { try{ const j=JSON.parse(rd.result); if(j.doc!==d.id){ const o=DOCS.find(x=>x.id===j.doc); throw new Error(T('这个答案档属于另一份文件（'+(o?t(o.name):j.doc)+'）。','This answer file belongs to a different document ('+(o?t(o.name):j.doc)+').')); } ANSWERS[d.id]=j.answers||{}; d.steps.flatMap(st=>st.fields).filter(f=>f.shared && filled(typeof ANSWERS[d.id][f.k]==='object'? (ANSWERS[d.id][f.k]||{}).st : ANSWERS[d.id][f.k])).forEach(f=>profile()[f.shared]=ANSWERS[d.id][f.k]); persist(); VIEW.step=d.steps.length; renderDoc(d); toast(T('答案已载入。','Answers loaded.')); }catch(err){ toast(T('无法载入：','Could not load: ')+err.message); } };
  rd.readAsText(file);
}

renderChrome();
applyFS();
route();
</script>
</body>
</html>
